# Bounds for dispatch.yml: the repositories a dispatched run may target.
# Exact names, no globs; add a repository here before dispatching to it.
# The midstream forks composefs-rs and bootc (epic #160) are targets for
# staged pull requests only: the poll does not follow them, so nothing merges
# into their main, which tracks upstream; the operator promotes work upstream.
hosts = ["github.com"]
repos = ["cgwalters-forge/tracker", "cgwalters-forge/agentic-job", "cgwalters-forge/agent-board", "cgwalters-forge-stage/board-test", "cgwalters-forge/review", "cgwalters-forge/actions", "cgwalters-forge/agenthome", "cgwalters-forge/misctool", "cgwalters-forge/composefs-rs", "cgwalters-forge/bootc", "cgwalters-forge/forge-infra"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
# `ready_when_complete`: apply opens complete work ready for review and only
# a checkpoint or a run stopped at a limit as a draft (agentic-job's
# docs/safe-outputs.md, "Ready or draft"). Without it every pull request is
# a draft and the poll stops on each as "a draft with no checkpoint" (#646).
# config.test.cjs keeps it set, here and in fix.toml.
create_pull_request = { max = 1, ready_when_complete = true }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# Pull requests (implement) may edit `.github/` in these repositories
# and no other; a fix's push may too, where fix.toml lists them. Exact names, no globs. The
# prerequisites are in agentic-job's docs/safe-outputs.md. `files` also lets them
# edit AGENTS.md, a protected file by default, there.
[unprotected_files]
# This repository by the operator's decision: docs/operator-notes.md, "2026-10-13, the harness evolving itself".
# A repository is listed only once a ruleset on its main requires an approving
# review with stale approvals dismissed on push: that review is the only gate
# on a run's `.github/` edit there. The organisation's ruleset (25084478) does
# so on every cgwalters-forge repository; review's own ruleset (24017897)
# requires none, so there it rests on 25084478 with review's workflow (review#62).
# Where there is no review workflow, as in misctool, only the operator
# can give that approval; its first `.github/` change should add one, approved by the
# operator. actions holds the shared wrapper every repository's runs call, so
# its gate matters most. Its own ruleset (24147876) requires no approval, but
# 25084478 with its review workflow (cgwalters-forge/actions#28) makes it the
# same review gate as agentic-job's. Callers use actions at @main, not a release,
# so a merge there takes effect at once. Its workflows are under `.github/`;
# while it was unlisted, no run could change them.
repos = ["cgwalters-forge/agentic-job", "cgwalters-forge/agent-board", "cgwalters-forge/tracker", "cgwalters-forge/review", "cgwalters-forge/actions", "cgwalters-forge/agenthome", "cgwalters-forge/misctool"]
# README.md too: a docs run there is refused otherwise (cgwalters-forge/agent-board#49).
# And every other name on agentic-job's default protected list, by the
# operator's decision (21 Oct): a blocked manifest or lockfile meant a run
# handed back a change CI couldn't build and a person had to land it
# (agentic-job#1450). The same review gates these as gates `.github/`, and
# each repository's review task checks dependency changes as supply chain.
files = ["AGENTS.md", "README.md", "package.json", "bun.lockb",
  "bunfig.toml", "deno.json", "deno.jsonc", "deno.lock", "global.json",
  "NuGet.Config", "Directory.Packages.props", "mix.exs", "mix.lock",
  "go.mod", "go.sum", "stack.yaml", "stack.yaml.lock", "pom.xml",
  "build.gradle", "build.gradle.kts", "settings.gradle",
  "settings.gradle.kts", "gradle.properties", "package-lock.json",
  "yarn.lock", "pnpm-lock.yaml", "npm-shrinkwrap.json", "requirements.txt",
  "Pipfile", "Pipfile.lock", "pyproject.toml", "setup.py", "setup.cfg",
  "Gemfile", "Gemfile.lock", "uv.lock", "CODEOWNERS", "DESIGN.md",
  "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "CLAUDE.md"]
dot_folders = [".github"]
