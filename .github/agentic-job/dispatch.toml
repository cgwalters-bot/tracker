# Bounds for dispatch.yml: the repositories a dispatched run may target.
# Exact names, no globs; add a repository here before dispatching to it.
hosts = ["github.com"]
repos = ["cgwalters-forge/tracker", "cgwalters-forge/agentic-job", "cgwalters-forge/agent-board", "cgwalters-forge-stage/board-test"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# To deliberately permit protected documentation:
# [unprotected_files]
# repos = ["OWNER/REPO"]
# files = ["README.md"]
