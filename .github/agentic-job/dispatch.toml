# Bounds for dispatch.yml: the repositories a dispatched run may target.
# Exact names, no globs; add a repository here before dispatching to it.
hosts = ["github.com"]
repos = ["cgwalters-forge/tracker", "cgwalters-forge/agentic-job", "cgwalters-forge/agent-board", "cgwalters-forge-stage/board-test", "cgwalters-forge/review", "cgwalters-bot/homegit", "cgwalters-bot/praxis-credential-broker", "cgwalters-forge/actions", "cgwalters-forge/agenthome"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[outputs]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# Pull requests (implement) may edit `.github/` in these repositories
# and no other; a fix's push may too, where fix.toml lists them. Exact names, no globs. The
# prerequisites are in agentic-job's docs/safe-outputs.md. `files` also lets them
# edit AGENTS.md, a protected file by default, there.
[unprotected_files]
# This repository by the operator's decision: docs/operator-notes.md, "2026-10-13, the harness evolving itself".
# A repository is listed only once a ruleset on its main requires an approving
# review with stale approvals dismissed on push: that review is the only gate
# on a run's `.github/` edit there. The organisation's ruleset (25084478) does
# so on every cgwalters-forge repository; review's own ruleset (24017897)
# requires none, so there it rests on 25084478. Where there is no review workflow,
# as in review today, only the operator can give that approval; review's
# first `.github/` change should add its review workflow, approved by the
# operator. agenthome and actions (cgwalters-forge/tracker#544) now meet it
# too but are left to changes of their own: actions holds the shared
# workflow every repository's runs call.
repos = ["cgwalters-forge/agentic-job", "cgwalters-forge/agent-board", "cgwalters-forge/tracker", "cgwalters-forge/review"]
# README.md too: a docs run there is refused otherwise (cgwalters-forge/agent-board#49).
files = ["AGENTS.md", "README.md"]
dot_folders = [".github"]
