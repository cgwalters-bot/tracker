# What the inputs of the workflow do not cover, for an agent that runs on
# GitHub's hosted `ubuntu-26.04`: the `config` input names this file. The
# workflow adds the agent, the inference proxy, the limits and the
# packages from its inputs. Another runner image listens on other
# sockets: `agentic-job sandbox check` fails on each one that is left and
# names it.

[sandbox]
# Daemons of the image that listen for every local user and that an agent
# run does not use.
stop-services = [
    # The runner's user is in docker's group.
    "docker.socket",
    "docker.service",
    "containerd.service",
    "ssh.socket",
    "ssh.service",
    "sshd-unix-local.socket",
    "snapd.socket",
    "snapd.service",
    "multipathd.socket",
    "multipathd.service",
    "uuidd.socket",
    "uuidd.service",
    "acpid.socket", "acpid.service",
    "iscsid.socket",
    "iscsid.service",
]

[sandbox.check]
allow-sockets = [
    # systemd-resolved, which the whole runner resolves names with, the
    # egress proxy included. It resolves for any user, so on this image
    # the agent can still send names out through it
    # (docs/sandbox-check.md).
    "/run/systemd/resolve/",
    # systemd-networkd, which the runner's network depends on: it
    # describes the links to any user and changes them only for root.
    "/run/systemd/netif/",
    "/run/systemd/resolve.hook/",
]

# The egress lockdown is off, by operator decision (#1441): no
# exfiltration concern, and it is the lead suspect for runs dying at
# about 63 minutes (#1425) and caused refused writes and missing tools
# (#1413). Without the proxy agentic-job loads no network rules and no
# write policy, so the agent has the runner's open network, but for the
# metadata service (host.deny-runner-metadata). The credential boundary
# is unchanged.
[egress]
proxy = false

[setup]
# The egress proxy runs in a Python environment of its own, behind
# nftables rules. Otherwise only what the ubuntu-26.04 image lacks: it has
# podman and uidmap, which an agent builds containers with, git, curl, tar
# and unzip, and Node with npm in /usr/local/bin, first on the agent's
# PATH and where `npm install -g` puts the agent. Ubuntu's npm would
# add some 350 node-* packages, a minute of setup and a mirror to flake on
# (#660). Another image may need them back.
packages = ["python3-venv", "nftables", "just"]

# Uncomment this table only after the wrapper upgrades to the agentic-job
# release containing #602: v0.2.0 rejects it and would break every dispatch.
# A moving ref could replace pre-lockdown setup code without review here.
# API-resolved merge of agenthome#4, also main on 2026-10-14:
# https://github.com/cgwalters-forge/agenthome/pull/4
# Runs unprivileged with upstream's bounded fetch/install phases; this does
# not widen sandbox egress. The installer and dependencies are trusted setup.
# [setup.tools]
# repository = "https://github.com/cgwalters-forge/agenthome.git"
# revision = "9b43eb81e1266ec762a6c49a4e31fb6b4ff3e0e0"
# recipe = "install-tools"

# The toolchain of each target repository, added to the packages above
# for a run on it (`default` for any other). It is the caller's choice:
# nothing is read from the target's own, untrusted, contents
# (agentic-job's docs/dispatch.md, "Giving runs a toolchain").
[setup.repo-packages]
# Ubuntu 26.04's Rust 1.93 (agentic-job needs 1.88) and gcc, with the
# same release's rustfmt and clippy so a run can pass the target's
# `cargo fmt` and `cargo clippy` checks (agentic-job 2159c17).
# No egress rule is needed (the proxy, when on, lets any GET through): a
# `cargo build --locked` only reads, from
#   index.crates.io   the sparse index
#   static.crates.io  the crates, checked against Cargo.lock
#   github.com        git dependencies (git fetch is already allowed)
# Their build scripts and proc macros run as the agent, the runner's user.
"cgwalters-forge/agentic-job" = ["cargo", "rustfmt", "rust-clippy"]
"cgwalters-forge/agent-board" = ["cargo", "rustfmt", "rust-clippy"]
"cgwalters-forge/tracker" = ["cargo", "rustfmt", "rust-clippy"]
"cgwalters-forge/misctool" = ["cargo", "rustfmt", "rust-clippy"]
# agenthome needs Rust 1.85, below Ubuntu 26.04's 1.93 (agenthome#61).
"cgwalters-forge/agenthome" = ["cargo", "rustfmt", "rust-clippy"]
# Their JavaScript is being ported to Rust (tracker#1260).
"cgwalters-forge/actions" = ["cargo", "rustfmt", "rust-clippy"]
"cgwalters-bot/praxis-credential-broker" = ["cargo", "rustfmt", "rust-clippy"]
# The midstream forks (epic #160). composefs-rs builds with pkg-config and
# OpenSSL for its HTTP fetch, as bcvk does; bootc also links libostree,
# glib and zstd.
"cgwalters-forge/composefs-rs" = ["cargo", "rustfmt", "rust-clippy", "pkg-config", "libssl-dev"]
"cgwalters-forge/bcvk" = ["cargo", "rustfmt", "rust-clippy", "pkg-config", "libssl-dev"]
"cgwalters-forge/rpm-ostree" = ["cargo", "rustfmt", "rust-clippy", "pkg-config", "libssl-dev"]
"cgwalters-forge/bootc" = ["cargo", "rustfmt", "rust-clippy", "pkg-config", "libssl-dev", "libostree-dev", "libglib2.0-dev", "libzstd-dev"]

# The window each broker model is given, which Vibe compacts at three
# quarters of (agentic-job's docs/harness.md). Without an entry a model gets
# 32k, compacted at 24k, at which a GLM research task compacted 18 times and
# lost its findings (agentic-job#821). GLM-5.3 documents 1M, but what the
# broker's provider serves is unconfirmed, so this stays at 128k until it is.
[agent.context-windows]
"zai-glm-5-3" = 131072

# Inert for ordinary runs; read by session runs (session.json). Logins stop
# other tailnet users prompting the agent; origins stop another website
# connecting with the operator's tailnet identity. Empty lists fail closed.
# The login is what `tailscale serve` sends for the operator's untagged
# devices; a tagged device sends none and is refused.
[session]
operators = ["cgwalters@gmail.com"]
# The review site's chat pane.
origins = ["https://cgwalters-forge.github.io"]
# Send a dispatched run the comments made on its item while it works, so
# the operator's later direction reaches it instead of being lost
# (agentic-job#1370). They arrive quoted with author and link, as data.
watch-item = true

[commit]
# Public-base fixture evidence only (#1455); experiment stays opted out.
allow-base-secret-lines = true
author = "cgwalters-bot <17814078+cgwalters-bot@users.noreply.github.com>"
trailers = ["Assisted-by: https://github.com/cgwalters/cgwalters#llms"]
