# Bounds for dispatch.yml's implement runs on the midstream forks, the
# repositories with the `bot-midstream` topic (#336): dispatch.toml's bounds
# without `ready_when_complete`, so apply opens every pull request there as
# a draft. A ready one was merged into a fork's main by mistake, putting it
# ahead of upstream (#290); their main tracks upstream, and the operator
# promotes work upstream instead. cgwalters-review skips drafts, so these
# get no automatic review; `/review` still works. The pass follows them for
# fix rounds, and `pr.noMerge` in pass.json keeps it from merging there.
# The one rule below is the list: agentic-job's policy admits a target by
# its live metadata (a public, unarchived fork in the organization with the
# topic and `origin` property), so giving a fork the topic is all it takes.
# The profile job of dispatch.yml picks this file for a target whose live
# metadata matches this rule's organization, fork flag and topics, and
# dispatch.toml's rule takes only non-forks, so a repository falls under
# one or the other. Protected files stay blocked except for the
# repository-scoped workflow admission below.
hosts = ["github.com"]
repos = [{ org = "cgwalters-forge", forks = true, topics = ["bot-midstream"], properties = { origin = "fork" } }]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50
# A misled run must not change the caller's execution destinations.
protected = [".github/agentic-job/runner-profiles.json"]

[github.outputs]
# Caller-owned opt-in avoids fork-only config commits on upstream-tracking main.
# Org CI is trusted only within the unchanged repository/branch admission below.
own-branch-repos = ["cgwalters-forge/*"]
create_pull_request = { max = 1 }
add_comment = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }

# Prevent unreviewed workflow edits from landing: these forks' effective main
# rules require an approval and dismiss stale approvals on push (25084478,
# rechecked 2026-11-05, ostree's 2026-11-18). check-review-gate monitors
# them. This admission itself must receive tracker's required review before
# taking effect (#258). ostree is named for its CI change only until #1869
# admits it by a metadata rule; midstream-fix.toml says why not for fixes.
[unprotected_files]
repos = ["cgwalters-forge/gh-agentic-workflows", "cgwalters-forge/ostree"]
dot_folders = [".github"]
