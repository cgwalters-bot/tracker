# Isolated from ordinary dispatches; like them it watches its item (hosted.toml).
# Match hosted.toml's hosted-runner sandbox and setup, without a tailnet listener.
[sandbox]
stop-services = [
    "docker.socket", "docker.service", "containerd.service",
    "ssh.socket", "ssh.service", "sshd-unix-local.socket",
    "snapd.socket", "snapd.service", "multipathd.socket", "multipathd.service",
    "uuidd.socket", "uuidd.service", "iscsid.socket", "iscsid.service",
]

[sandbox.check]
allow-sockets = ["/run/systemd/resolve/", "/run/systemd/netif/", "/run/systemd/resolve.hook/"]

[setup]
packages = ["python3-venv", "nftables", "just"]

# The caller includes agenthome's profile and skill in the task for every pool.
# Watching stops an operator's later comment being lost while this run works;
# steer treats other authors' text as data, not operator instructions.
[session]
watch-item = true

[commit]
author = "agentic-job <agentic-job@users.noreply.github.com>"
trailers = ["Generated-by: AI"]
