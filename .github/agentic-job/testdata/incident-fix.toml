# Historical bounds shared with #1437, from tracker 873d7b18e058271fe7b03daa5f2eeb838ffdb868.
# Only the receiving push policy surface is needed for resolver/policy replay.
hosts = ["github.com"]
repos = ["cgwalters-forge/tracker", "cgwalters-forge/agentic-job"]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 50

[github.outputs]
push_to_pull_request_branch = { max = 1, branches = ["dispatch/**", "bot/**", "release-train/**"], replacement_max_commits = 5, ready_when_complete = true }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
