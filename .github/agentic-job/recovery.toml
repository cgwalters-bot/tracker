# Bounds for dispatch.yml's recovery triage: agent-board's PR recovery
# (pass.json's pr.agentRecovery, agent-board#993) dispatches a `triage`
# whose item is the exhausted pull request itself, and its task asks the
# run to close the pull request as obsolete, or to file a fresh issue with
# an implement plan and close it (replan). dispatch.yml picks this file only
# for a triage whose item is a pull request of the target, and has the
# wrapper take that run's output types from here (its
# triage-outputs-from-allow) instead of comment.toml's comment-only ones.
# Threat: a triage misled by issue or PR text closing pull requests or
# filing issues where it should not. Every other triage keeps comment.toml,
# and this file admits only our own repositories by metadata, the rules of
# dispatch.toml and midstream.toml: no bootc-dev or other owner's
# repository, and no name agentic-job cannot check. Closing and filing are
# on the run's repository only (agentic-job's docs/safe-outputs.md), one of
# each, and policy drops pull requests and pushes for this analysis run.
# agentic-job cannot yet tie the close to the item: within the repository,
# the one close may name another pull request, which only the triage
# profile forbids. The followed repositories outside these rules
# (praxis-credential-broker, board-test) get no recovery: policy refuses a
# triage of their pull requests.
hosts = ["github.com"]
repos = [{ org = "cgwalters-forge", forks = false }, { org = "cgwalters-forge", forks = true, topics = ["bot-midstream"], properties = { origin = "fork" } }]
bases = ["main"]
max_outputs = 3
max_patch_bytes = 1048576
max_patch_files = 10000

[github.outputs]
add_comment = { max = 1 }
close_pull_request = { max = 1 }
create_issue = { max = 1 }
noop = { max = 1 }
missing_tool = { max = 1 }
missing_data = { max = 1 }
