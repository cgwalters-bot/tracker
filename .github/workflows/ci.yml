# Checks of this repository's own automation, so a pull request that edits
# `.github/` is tested before it merges. The one job named ci is what the
# main branch ruleset requires: a new check is added to its `needs`, with
# no change to the ruleset.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests of the scripts under .github, through the Justfile.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hosted image's Node and Rust; the scripts have no dependencies
      # to install, and test-config's crate fetches its locked ones.
      # A pinned just: Ubuntu's apt carries an old one (1.21 on 24.04).
      # A GitHub release outage (504s for over an hour on 2026-11-08) must not
      # stop the job: build the same just from crates.io instead.
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install the supervisor's verified pinned config validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: just build-supervisor-agent-board
      # Today's policy on PATH, so just test checks the current bounds for real.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/agentic-job
          ref: 427ce2295925654be9c35e91ca5cee91bbc2c9ea # supports own_author in the current bounds
          path: _dispatch-policy
          persist-credentials: false
      - name: Install the pinned policy binary by verified source digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash _dispatch-policy/secure-host/binary.sh get --out "$RUNNER_TEMP/dispatch-policy-bin"
          echo "$RUNNER_TEMP/dispatch-policy-bin" >> "$GITHUB_PATH"
      # Mandatory real resolver/policy replay at the incident's immutable pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/agentic-job
          ref: a5f7a3963fd41f3eb09c4406aa5bc8e30ee42be2 # v0.6.10
          path: admission-policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cgwalters-forge/actions
          ref: bac2da6d67101ab6ca520d9d63adc46da77e4513
          fetch-depth: 0 # also contains the earlier recorded wrapper
          path: admission-actions
          persist-credentials: false
      - name: Build the immutable admission policy
        run: cargo build --locked --manifest-path admission-policy/Cargo.toml -p agentic-job --target-dir "$RUNNER_TEMP/admission-policy-target"
      # Keep replay inline: deployment scripts and Justfile may only shrink.
      - name: Required offline dispatch admission replay
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const http = require('node:http');
          const vm = require('node:vm');
          const { spawn, spawnSync, execFileSync } = require('node:child_process');
          const actions = path.resolve(process.env.ADMISSION_ACTIONS || 'admission-actions');
          const source = path.resolve(process.env.ADMISSION_POLICY || 'admission-policy');
          const binary = path.join(process.env.RUNNER_TEMP, 'admission-policy-target/debug/agentic-job');
          const read = p => fs.readFileSync(p, 'utf8');
          const git = (dir, ...args) => execFileSync('git', ['-C', dir, ...args], { encoding: 'utf8' }).trim();
          const fixture = JSON.parse(read('.github/agentic-job/testdata/dispatch-admission.json'));
          assert.equal(git(source, 'rev-parse', 'HEAD'), fixture.policy_revision);
          assert.equal(git(source, 'status', '--porcelain', '--untracked-files=no'), '', 'policy source must be clean');
          assert.match(execFileSync(binary, ['--version'], { encoding: 'utf8' }), /^agentic-job 0\.6\.10\s*$/);
          const workflow = read('.github/workflows/dispatch.yml');
          const ci = read('.github/workflows/ci.yml').split('\n  lint:\n')[0];
          assert.ok(ci.includes(`ref: ${fixture.policy_revision}`));
          const replay = ci.split('      - name: Required offline dispatch admission replay\n')[1];
          assert.ok(replay.startsWith('        shell: node {0}\n        run: |\n'), 'replay must be unconditional');
          const step = name => new RegExp(`- name: ${name}[^]*?        run: \\|\n((?:          .*\n)+)`)
            .exec(workflow)[1].replace(/^          /gm, '');
          const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'dispatch-admission-'));
          const env = { PATH: process.env.PATH, HOME: temp, GH_TOKEN: ['offline', 'fixture'].join('-') };
          process.on('exit', () => fs.rmSync(temp, { recursive: true, force: true }));
          const shell = (script, extra) => spawnSync('bash', ['-euo', 'pipefail', '-c', script], {
            env: { ...env, ...extra }, encoding: 'utf8', timeout: 10000 });
          function bounds(repo) {
            const output = path.join(temp, 'output');
            fs.writeFileSync(output, '');
            const result = shell(step('Resolve the bounds'), { KIND: 'fix', REPO: repo, GITHUB_OUTPUT: output });
            assert.equal(result.status, 0, result.stderr);
            const selected = Object.fromEntries(read(output).trim().split('\n').map(line => line.split('=')));
            assert.deepEqual(selected, { allow: '.github/agentic-job/dispatch.toml', 'fix-allow': '.github/agentic-job/fix.toml' });
            return selected;
          }
          for (const key of ['allow', 'fix-allow']) assert.ok(workflow.includes(`${key}: $\u007b\u007b needs.profile.outputs.${key} \u007d\u007d`));
          // Read the actual immutable wrapper objects. No fixture-owned guard strings.
          const guards = fixture.wrapper_revisions.map(revision => {
            const wrapper = git(actions, 'show', `${revision}:.github/workflows/cgwalters-agentic-job.yml`);
            assert.ok(wrapper.includes(`policy.yml@${fixture.policy_revision}`));
            const jobs = {};
            for (const [job, dependencies] of [['agent', '[target, policy]'], ['apply', '[policy, agent, check, session]']]) {
              const block = wrapper.split(`\n  ${job}:\n`)[1];
              assert.ok(block.startsWith(`    needs: ${dependencies}\n`));
              jobs[job] = /\n    if: \$\{\{ (.*) \}\}/.exec(block)[1];
            }
            assert.equal(jobs.agent, "needs.policy.outputs.admitted == 'true'");
            assert.equal(jobs.apply, "always() && needs.policy.result == 'success'");
            const select = /\n      allow: \$\{\{ (.*) \}\}/.exec(wrapper)[1].replaceAll('inputs.fix-allow', 'inputs["fix-allow"]');
            for (const pull of fixture.pulls) assert.equal(vm.runInNewContext(select, { inputs: { kind: 'fix', ...bounds(pull.base.repo.full_name) } }), '.github/agentic-job/fix.toml');
            return jobs;
          });
          function downstream(refused) {
            const needs = { policy: { result: refused ? 'failure' : 'success', outputs: { admitted: refused ? '' : 'true' } } };
            for (const jobs of guards) for (const job of ['agent', 'apply']) {
              assert.equal(vm.runInNewContext(jobs[job], { needs, always: () => true }), !refused);
            }
          }
          // Current bounds must retain the same excluded-head rule as the historical replay.
          const toml = spawnSync('python3', ['-c', 'import json,tomllib; print(json.dumps([tomllib.load(open(p,"rb"))["github"]["outputs"]["push_to_pull_request_branch"]["branches"] for p in [".github/agentic-job/fix.toml", ".github/agentic-job/testdata/incident-fix.toml"]]))'], { encoding: 'utf8' });
          assert.equal(toml.status, 0, toml.stderr);
          const [current, recorded] = JSON.parse(toml.stdout);
          assert.deepEqual(current, recorded);
          const receiptJob = workflow.split('\n  admission-receipt:\n')[1];
          assert.match(receiptJob, /vars.DISPATCH_ADMISSION_RECEIPT == 'enabled'/);
          const receiptGuard = /    if: \$\{\{ (.*) \}\}/.exec(receiptJob)[1];
          for (const activation of [undefined, '', 'disabled', 'true', 'enabled']) for (const kind of ['fix', 'implement', 'review']) {
            assert.equal(vm.runInNewContext(receiptGuard, { always: () => true, inputs: { kind }, vars: { DISPATCH_ADMISSION_RECEIPT: activation } }), activation === 'enabled' && kind !== 'review');
          }
          assert.match(receiptJob, /needs: \[profile, run\]/);
          assert.match(receiptJob, /timeout-minutes: 1\n    permissions: \{\}/);
          assert.doesNotMatch(receiptJob.split('        run: |')[0], /inputs\.(repo|item|task)|toJSON|secrets\./);
          // Check what Actions prints before running the step, not only the JSON.
          const receiptEnv = receiptJob.split('        env:\n')[1].split('        run: |')[0];
          assert.equal((receiptEnv.match(/: \$\{\{/g) || []).length, 4);
          for (const [key, values] of [['ALLOW', ['.github/agentic-job/dispatch.toml', '.github/agentic-job/comment.toml', '.github/agentic-job/midstream.toml']], ['FIX_ALLOW', ['.github/agentic-job/fix.toml', '.github/agentic-job/midstream-fix.toml']]]) {
            const expression = new RegExp(`${key}: \\$\\{\\{ (.*) \\}\\}`).exec(receiptEnv)[1].replaceAll('outputs.fix-allow', 'outputs["fix-allow"]');
            for (const value of [undefined, '', 'x'.repeat(10000), '\n::error::injected', ...values]) {
              const got = vm.runInNewContext(expression, { needs: { profile: { outputs: { allow: value, 'fix-allow': value } } }, fromJSON: JSON.parse, contains: (a, b) => a.includes(b) });
              assert.equal(got, values.includes(value) ? value : '', 'env is allowlisted before Actions logging');
            }
          }
          const eventPath = path.join(temp, 'event.json');
          for (const result of ['success', 'failure', 'cancelled', 'skipped', undefined]) {
            for (const inputs of [{ kind: 'fix', repo: 'cgwalters-forge/tracker', item: '1050' }, {}, { kind: 'x'.repeat(10000), repo: 'x'.repeat(10000), item: '9'.repeat(10000), task: 'not public\n::error::secret' }, { kind: 'fix', repo: '\n::error::secret', item: '1\n::error::secret' }]) {
              fs.writeFileSync(eventPath, JSON.stringify({ inputs, task: 'not public' }));
              const got = shell(step('Record dispatch admission outcome'), { GITHUB_EVENT_PATH: eventPath, GITHUB_RUN_ID: '42', GITHUB_RUN_ATTEMPT: '1', GITHUB_EVENT_NAME: 'workflow_dispatch', GITHUB_ACTOR: 'bot\n::error::secret', ...(result ? { PROFILE_RESULT: result, WRAPPER_RESULT: result, FIX_ALLOW: '.github/agentic-job/fix.toml' } : {}) });
              assert.equal(got.status, 0, got.stderr);
              assert.equal(got.stdout.trim().split('\n').length, 1);
              assert.doesNotMatch(got.stdout, /not public|::error::|secret/);
              const receipt = JSON.parse(got.stdout);
              assert.ok(Object.values(receipt).every(v => v.length <= 256));
              assert.equal(receipt.wrapper_result, result || '');
              assert.equal(receipt.profile_result, result || '');
              assert.equal(receipt.selected_bounds, inputs.kind === 'fix' && result ? '.github/agentic-job/fix.toml' : '');
            }
          }
          const cli = (args, api) => new Promise((resolve, reject) => {
            const child = spawn(binary, args, { env: { ...env, GITHUB_API_URL: api } });
            let stdout = '', stderr = '';
            const timer = setTimeout(() => child.kill('SIGKILL'), 10000);
            child.stdout.on('data', data => { stdout += data; });
            child.stderr.on('data', data => { stderr += data; });
            child.on('error', error => { clearTimeout(timer); reject(error); });
            child.on('close', status => { clearTimeout(timer); resolve({ status, stdout, stderr }); });
          });
          (async () => {
            let pull;
            const requests = [];
            const server = http.createServer((req, res) => {
              requests.push(`${req.method} ${req.url}`);
              const repo = pull.base.repo.full_name;
              const routes = { [`/repos/${repo}/pulls/${pull.number}`]: pull,
                [`/repos/${repo}/git/ref/heads/main`]: { object: { type: 'commit', sha: pull.base.sha } } };
              res.writeHead(req.method === 'GET' && Object.hasOwn(routes, req.url) ? 200 : 404, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify(routes[req.url] ?? {}));
            });
            await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
            const api = `http://127.0.0.1:${server.address().port}`;
            async function receive(value) {
              pull = value;
              requests.length = 0;
              bounds(pull.base.repo.full_name);
              const repo = pull.base.repo.full_name;
              const resolved = await cli(['push', 'resolve', '--event', 'false', '--review', 'false', '--kind', 'branch', '--item', String(pull.number), '--repo', repo, '--output-repo', repo], api);
              if (resolved.status !== 0) { downstream(true); return { ...resolved, stage: 'resolve' }; }
              const outputs = Object.fromEntries(resolved.stdout.trim().split('\n').map(line => line.split('=')));
              const policy = await cli(['policy', '--allow', '.github/agentic-job/testdata/incident-fix.toml', '--repo', repo, '--clone-url', `https://github.com/${repo}`, '--base', outputs.branch, '--kind', 'branch', '--outputs', 'push_to_pull_request_branch,noop,missing_tool,missing_data', '--max-outputs', '3', '--pull-request', String(pull.number), '--head', outputs.head, '--output-repo', repo], api);
              downstream(policy.status !== 0);
              return { ...policy, stage: 'policy' };
            }
            try {
              for (const recorded of fixture.pulls) {
                let previous;
                for (let repeat = 0; repeat < 2; repeat++) {
                  const result = await receive({ ...recorded, state: 'open' });
                  assert.equal(result.stage, 'policy');
                  assert.equal(result.status, 1, result.stderr);
                  assert.ok(result.stderr.includes(`pull request branch "${recorded.head.ref}" is not within the bounds (dispatch/**, bot/**, release-train/**)`), result.stderr);
                  assert.equal(result.stdout, '', 'no policy reaches agent/apply');
                  if (previous) assert.equal(result.stderr, previous.stderr);
                  previous = result;
                  assert.equal(requests.length, 2, 'PR and base-ref GETs only');
                }
                for (const ref of [recorded.head.ref, 'bot/offline-admission-control']) {
                  const closed = await receive({ ...recorded, head: { ...recorded.head, ref } });
                  assert.equal(closed.stage, 'resolve');
                  assert.notEqual(closed.status, 0, closed.stderr);
                  assert.match(closed.stderr, /open pull request/);
                  assert.equal(requests.length, 1, 'closed/superseded stops before policy');
                }
                const allowed = await receive({ ...recorded, state: 'open', head: { ...recorded.head, ref: 'bot/offline-admission-control' } });
                assert.equal(allowed.status, 0, allowed.stderr);
                assert.equal(JSON.parse(allowed.stdout).safe_outputs.push_to_pull_request_branch.target, String(recorded.number));
              }
              console.log('ok: both immutable wrappers, excluded heads and identical repeats, closed/superseded targets, open bot control, bounded receipt and pre-log env');
            } finally { await new Promise(resolve => server.close(resolve)); }
          })().catch(error => { console.error(error); process.exitCode = 1; });
      - run: just test
        env:
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
      # Keep new scripts inline: deployment scripts and Justfile may only shrink.
      - name: Test checklist evaluation scoring
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const { test, after } = require('node:test');
          const { mkdtempSync, writeFileSync, readFileSync, rmSync } = require('node:fs');
          const { tmpdir } = require('node:os');
          const { join } = require('node:path');
          const { pathToFileURL } = require('node:url');
          const { spawnSync } = require('node:child_process');
          const source = /```javascript\n([^]*?)```/.exec(readFileSync('docs/review-checklist/evaluation-scoring.md', 'utf8'))[1];
          const temp = mkdtempSync(join(tmpdir(), 'checklist-scoring-module-'));
          const modulePath = join(temp, 'score.mjs');
          after(() => rmSync(temp, { recursive: true, force: true }));
          writeFileSync(modulePath, source);
          (async () => {
            const { score } = await import(pathToFileURL(modulePath));

            function ledger() {
              const run = { model: 'fixture', provenance: 'synthetic-only', prompt_sha256: 'a'.repeat(64) };
              return { schema: 'checklist-scores/v1', checklist_version: 'fixture', sample: 'synthetic sample',
                adjudicator: 'synthetic test', runs: { baseline: run, checklist: run }, prs: [
                  { url: 'https://github.com/example/project/pull/1', language: 'Rust', comments: ['c1', 'c2', 'c3'],
                    baseline: [{ id: 'b1', matches: ['c1'], reason: 'same concern' },
                      { id: 'b2', matches: [], audit: 'unreviewed' }],
                    checklist: [{ id: 'f1', matches: ['c1', 'c2'], reason: 'same root' },
                      { id: 'f2', matches: ['c1'], reason: 'duplicate finding, not another catch' },
                      { id: 'f3', matches: [], audit: 'supported', reason: 'valid additional concern' },
                      { id: 'f4', matches: [], audit: 'noise', reason: 'inapplicable' },
                      { id: 'f5', matches: [], audit: 'unresolved', reason: 'needs context' }] },
                  { url: 'https://github.com/example/project/pull/2', language: 'C', comments: ['c1'], baseline: [], checklist: [] },
                ] };
            }

            test('counts unique catches, separate finding denominators, language strata and audit coverage', () => {
              const result = score(ledger());
              assert.deepEqual(result.totals.checklist, { prs: 2, operator_comments: 4, caught: 2, missed: 2,
                findings: 5, matched_findings: 2, unmatched_findings: 3, audited_unmatched: 3,
                supported_unmatched: 1, noise_unmatched: 1, unresolved_unmatched: 1 });
              assert.equal(result.totals.baseline.caught, 1);
              assert.equal(result.totals.baseline.audited_unmatched, 0);
              assert.equal(result.languages.Rust.checklist.missed, 1);
              assert.equal(result.languages.C.baseline.missed, 1);
              assert.equal(result.languages.C.baseline.findings, 0);
              assert.equal(result.unmatched.length, 4);
              assert.equal(result.sample_size, 2);
              assert.equal(result.target_sample_size, 30);
            });

            test('per-PR counts retain empty passes and reconcile every denominator', () => {
              const input = ledger();
              // Same-stratum PRs must remain distinct; IDs may repeat between PRs.
              input.prs[1].language = 'Rust';
              input.prs[1].baseline = [{ id: 'b1', matches: ['c1'], reason: 'lost with checklist' },
                { id: 'b2', matches: [], audit: 'unreviewed' }];
              const before = structuredClone(input);
              const result = score(input);
              assert.deepEqual(result.prs.map(({ pr, language }) => ({ pr, language })),
                input.prs.map(({ url, language }) => ({ pr: url, language })));
              assert.deepEqual(result.prs[0].checklist, { prs: 1, operator_comments: 3, caught: 2, missed: 1,
                findings: 5, matched_findings: 2, unmatched_findings: 3, audited_unmatched: 3,
                supported_unmatched: 1, noise_unmatched: 1, unresolved_unmatched: 1 });
              assert.deepEqual(result.prs[1].checklist, { prs: 1, operator_comments: 1, caught: 0, missed: 1,
                findings: 0, matched_findings: 0, unmatched_findings: 0, audited_unmatched: 0,
                supported_unmatched: 0, noise_unmatched: 0, unresolved_unmatched: 0 });
              assert.equal(result.prs[1].baseline.caught, 1);
              assert.equal(result.prs[1].baseline.unmatched_findings, 1);
              assert.equal(result.prs[1].baseline.audited_unmatched, 0);
              for (const pass of ['baseline', 'checklist']) {
                for (const key of Object.keys(result.totals[pass])) {
                  assert.equal(result.prs.reduce((sum, pr) => sum + pr[pass][key], 0), result.totals[pass][key], key);
                  for (const [language, counts] of Object.entries(result.languages)) {
                    assert.equal(result.prs.filter(pr => pr.language === language)
                      .reduce((sum, pr) => sum + pr[pass][key], 0), counts[pass][key], key);
                  }
                }
              }
              assert.deepEqual(input, before);
              result.prs[0].checklist.caught = 999;
              assert.equal(result.totals.checklist.caught, 2, 'rows do not alias aggregate counters');
              assert.equal(result.prs[1].checklist.caught, 0, 'rows do not share counters');
            });

            test('paired catches expose gains and losses even when aggregate recall is unchanged', () => {
              const input = ledger();
              input.prs[0].baseline.push({ id: 'b3', matches: ['c3'], reason: 'baseline-only concern' });
              const before = structuredClone(input);
              const result = score(input);
              assert.equal(result.totals.baseline.caught, result.totals.checklist.caught);
              assert.deepEqual(result.paired.totals, { both: 1, baseline_only: 1, checklist_only: 1, neither: 1 });
              assert.deepEqual(result.paired.languages, {
                Rust: { both: 1, baseline_only: 1, checklist_only: 1, neither: 0 },
                C: { both: 0, baseline_only: 0, checklist_only: 0, neither: 1 },
              });
              assert.deepEqual(result.paired.prs, [
                { pr: input.prs[0].url, both: ['c1'], baseline_only: ['c3'], checklist_only: ['c2'], neither: [] },
                { pr: input.prs[1].url, both: [], baseline_only: [], checklist_only: [], neither: ['c1'] },
              ]);
              assert.deepEqual(input, before);
              for (const pr of input.prs) { pr.baseline = []; pr.checklist = []; }
              assert.deepEqual(score(input).paired.totals, { both: 0, baseline_only: 0, checklist_only: 0, neither: 4 });
              for (const pass of ['baseline', 'checklist']) {
                for (const pr of input.prs) pr[pass] = [{ id: 'all', matches: pr.comments, reason: 'all concerns' }];
              }
              assert.deepEqual(score(input).paired.totals, { both: 4, baseline_only: 0, checklist_only: 0, neither: 0 });
            });

            test('PR identity ignores owner/repository case, not PR number or repository', () => {
              for (const url of ['https://github.com/Example/project/pull/1',
                'https://github.com/example/Project/pull/1', 'https://github.com/EXAMPLE/PROJECT/pull/1']) {
                const input = ledger();
                input.prs[1].url = url;
                assert.throws(() => score(input), /PRs: empty or duplicate ID/);
              }
              for (const url of ['https://github.com/Example/Project/pull/2',
                'https://github.com/Example/Other/pull/1', 'https://github.com/Other/Project/pull/1']) {
                const input = ledger();
                input.prs[0].url = url;
                input.prs[1].url = 'https://github.com/example/project/pull/1';
                const before = structuredClone(input);
                const result = score(input);
                assert.equal(result.sample_size, 2);
                assert.equal(result.totals.baseline.operator_comments, 4);
                assert.equal(result.unmatched[0].pr, url, 'retain the archived URL spelling');
                assert.deepEqual(input, before, 'do not mutate the ledger');
              }
            });

            test('refuses ambiguous or incomplete adjudications rather than silently improving scores', () => {
              for (const mutate of [
                x => { x.schema = 'other'; }, x => { delete x.runs.checklist; },
                x => { x.runs.baseline.prompt_sha256 = 'not-a-digest'; }, x => { delete x.sample; },
                x => { x.prs = []; }, x => { x.prs = Array(31).fill(x.prs[0]); },
                x => { x.prs.push(x.prs[0]); }, x => { x.prs[0].language = '__proto__'; },
                x => { x.prs[0].comments.push('c1'); }, x => { x.prs[0].comments = []; },
                x => { delete x.prs[0].baseline; }, x => { x.prs[0].baseline.push(x.prs[0].baseline[0]); },
                x => { x.prs[0].baseline[0].matches = ['unknown']; },
                x => { x.prs[0].baseline[0].matches = ['c1', 'c1']; },
                x => { delete x.prs[0].baseline[0].reason; },
                x => { x.prs[0].baseline[0].audit = 'noise'; },
                x => { delete x.prs[0].baseline[1].audit; },
                x => { x.prs[0].baseline[1].audit = 'wrong'; },
                x => { delete x.prs[0].checklist[2].reason; },
              ]) {
                const input = ledger(); mutate(input); assert.throws(() => score(input));
              }
            });

            test('CLI binds a complete ledger to the frozen sampler output only when requested', () => {
              const { createHash } = require('node:crypto');
              const splitter = readFileSync('docs/review-corpus.md', 'utf8').split('```js split-corpus\n')[1].split('\n```')[0];
              const sampleInventory = new Function('require', splitter + '\nreturn sampleInventory;')(require);
              const input = ledger();
              input.prs = Array.from({ length: 30 }, (_, i) => ({ ...structuredClone(input.prs[i % 2]),
                url: `https://github.com/example/project/pull/${i + 1}` }));
              const inventory = { schema: 'review-checklist.holdout-metadata.v1', prs: input.prs.map(pr => ({
                url: pr.url, first_feedback: '2026-06-01T00:00:00Z', inline_comments: 1,
                inline_languages: Object.fromEntries(['Rust', 'C', 'shell', 'Go', 'Python', 'docs', 'other']
                  .map(language => [language, Number(language === pr.language)])),
              })) };
              const sample = sampleInventory(Buffer.from(JSON.stringify(inventory)), { seed: 'frozen', allocation: { Rust: 15, C: 15 } });
              const file = join(temp, 'paired-ledger.json');
              const frozen = join(temp, 'sample.json');
              const run = (value, bytes = JSON.stringify(sample)) => {
                writeFileSync(file, JSON.stringify(value));
                writeFileSync(frozen, bytes);
                return spawnSync(process.execPath, [modulePath, file, '--sample', frozen], { encoding: 'utf8' });
              };
              // Order and repository spelling are not changes of PR identity.
              input.prs.reverse();
              input.prs[0].url = input.prs[0].url.replace('example/project', 'EXAMPLE/Project');
              const ok = run(input);
              assert.equal(ok.status, 0, ok.stderr);
              const result = JSON.parse(ok.stdout);
              assert.deepEqual(result.sample_check, { schema: sample.schema, prs: 30,
                sha256: createHash('sha256').update(JSON.stringify(sample)).digest('hex') });
              delete result.sample_check;
              assert.deepEqual(result, score(input));
              for (const mutate of [
                x => x.prs.pop(),
                x => { x.prs[0].url = 'https://github.com/example/project/pull/999'; },
                x => { x.prs[0].language = 'Go'; },
              ]) {
                const changed = structuredClone(input); mutate(changed);
                const bad = run(changed);
                assert.equal(bad.status, 1);
                assert.equal(bad.stdout, '');
                assert.match(bad.stderr, /frozen sample/);
              }
              for (const mutate of [
                x => { x.schema = 'unknown'; }, x => x.prs.pop(),
                x => { x.prs[0] = null; }, x => { x.prs[0].language = 'unknown'; },
                x => { x.prs[0].url = 'not-a-PR'; },
                x => { x.prs[0] = { ...x.prs[1], url: x.prs[1].url.replace('example', 'EXAMPLE') }; },
              ]) {
                const changed = structuredClone(sample); mutate(changed);
                const bad = run(input, JSON.stringify(changed));
                assert.equal(bad.status, 1);
                assert.equal(bad.stdout, '');
              }
              for (const bytes of [Buffer.from([0xff]), '{"feedback":broken', ' '.repeat(65537)]) {
                const bad = run(input, bytes);
                assert.equal(bad.status, 1);
                assert.equal(bad.stdout, '');
                assert.doesNotMatch(bad.stderr, /feedback/);
              }
              const ordinary = spawnSync(process.execPath, [modulePath, file], { encoding: 'utf8' });
              assert.equal(ordinary.status, 0, ordinary.stderr);
              assert.equal(Object.hasOwn(JSON.parse(ordinary.stdout), 'sample_check'), false);
            });

            test('CLI rejects malformed UTF-8 instead of inventing matching archive IDs', () => {
              const file = join(temp, 'encoding.json');
              const run = content => {
                writeFileSync(file, content);
                return spawnSync(process.execPath, [modulePath, file], { encoding: 'utf8' });
              };
              const input = ledger();
              input.prs[1].comments = ['comment-\uFFFD'];
              input.prs[1].baseline = [{ id: 'unicode-\u00e9-\ud83d\ude80', matches: ['comment-\uFFFD'], reason: 'same concern' }];
              const valid = JSON.stringify(input);
              const ok = run(valid);
              assert.equal(ok.status, 0, ok.stderr);
              assert.deepEqual(JSON.parse(ok.stdout), score(input), 'valid Unicode, including U+FFFD, is preserved');
              const marker = Buffer.from('comment-\uFFFD');
              const bytes = Buffer.from(valid);
              const offset = bytes.indexOf(marker) + Buffer.byteLength('comment-');
              // Corrupt only the comment ID, leaving the match's literal U+FFFD intact.
              // Lossy decoding would falsely report that the baseline caught it.
              for (const invalid of [[0xff], [0x80], [0xc0, 0xaf], [0xe2, 0x82], [0xed, 0xa0, 0x80]]) {
                const bad = run(Buffer.concat([bytes.subarray(0, offset), Buffer.from(invalid), bytes.subarray(offset + 3)]));
                assert.equal(bad.status, 1, `invalid UTF-8 ${invalid}`);
                assert.equal(bad.stdout, '');
                assert.match(bad.stderr, /invalid ledger UTF-8/);
                assert.doesNotMatch(bad.stderr, /comment-|same concern/);
              }
            });

            test('CLI emits JSON only on success and bounds input without leaking malformed contents', () => {
              const dir = mkdtempSync(join(tmpdir(), 'checklist-score-'));
              const file = join(dir, 'ledger.json');
              const run = args => spawnSync(process.execPath, [modulePath, ...args], { encoding: 'utf8' });
              try {
                writeFileSync(file, JSON.stringify(ledger()));
                const ok = run([file]);
                assert.equal(ok.status, 0, ok.stderr);
                assert.deepEqual(JSON.parse(ok.stdout), score(ledger()));
                assert.equal(run(['--help']).status, 0);
                const duplicate = ledger();
                duplicate.prs[1].url = 'https://github.com/EXAMPLE/PROJECT/pull/1';
                writeFileSync(file, JSON.stringify(duplicate));
                const rejected = run([file]);
                assert.equal(rejected.status, 1);
                assert.equal(rejected.stdout, '');
                assert.match(rejected.stderr, /PRs: empty or duplicate ID/);
                for (const content of ['{"private-feedback": broken', ' '.repeat(1024 * 1024 + 1)]) {
                  writeFileSync(file, content);
                  const bad = run([file]);
                  assert.equal(bad.status, 1);
                  assert.equal(bad.stdout, '');
                  assert.doesNotMatch(bad.stderr, /private-feedback/);
                }
                assert.equal(run([]).status, 1);
                assert.equal(run([join(dir, 'missing')]).status, 1);
              } finally { rmSync(dir, { recursive: true, force: true }); }
            });
          })().catch(error => { console.error(error); process.exitCode = 1; });
      # Keep new scripts inline: deployment scripts and Justfile may only shrink.
      - name: Test review-corpus resume checksums
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const workflow = fs.readFileSync('.github/workflows/review-corpus.yml', 'utf8');
          const temp = fs.mkdtempSync(require('node:path').join(require('node:os').tmpdir(), 'review-corpus-resume-'));
          const stubs = `${temp}/stubs`;
          try {
            fs.mkdirSync(stubs);
            // Execute the actual resume step. Only transport/decompression are stubbed;
            // real sha256sum verifies both assets, including historical manifests.
            const download = /- name: Download the current corpus\n[\s\S]*?run: \|\n([\s\S]*?)(?=      # A reserve)/.exec(workflow)[1].replace(/^          /gm, '');
            fs.writeFileSync(`${stubs}/gh`, `#!${process.execPath}
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const args = process.argv.slice(2);
          const mode = process.env.DOWNLOAD_CASE;
          if (args[1] === 'list') { if (mode !== 'first') console.log('review-corpus-20261105-000001'); }
          else {
            const names = ['review-corpus.jsonl.zst', 'review-corpus-state.json'];
            const checksums = names.map(name => createHash('sha256').update(name).digest('hex') + '  ' + name);
            for (const name of names) if (mode !== 'missing-' + name) fs.writeFileSync(name, mode === 'corrupt-' + name ? 'damaged' : name);
            if (mode !== 'missing-manifest') fs.writeFileSync('SHA256SUMS', mode === 'empty-manifest' ? '' :
              checksums.filter((_, i) => mode !== 'missing-checksum-' + i).join('\\n') + '\\n' +
              (mode === 'modern' ? '0'.repeat(64) + '  status.json\\n' : ''));
            if (!args.includes('SHA256SUMS')) process.exit(2);
          }
          `, { mode: 0o755 });
            fs.writeFileSync(`${stubs}/zstd`, `#!${process.execPath}\nrequire('node:fs').writeFileSync('decompressed', '');\n`, { mode: 0o755 });
            for (const mode of ['first', 'historical', 'modern', 'missing-manifest', 'empty-manifest',
              'missing-checksum-0', 'missing-checksum-1', ...['review-corpus.jsonl.zst', 'review-corpus-state.json']
                .flatMap(name => ['missing-' + name, 'corrupt-' + name])]) {
              for (const name of ['review-corpus.jsonl.zst', 'review-corpus-state.json', 'SHA256SUMS', 'decompressed'])
                fs.rmSync(`${temp}/${name}`, { force: true });
              const got = spawnSync('bash', ['-euo', 'pipefail', '-c', download], { cwd: temp, encoding: 'utf8',
                env: { ...process.env, PATH: `${stubs}:${process.env.PATH}`, DOWNLOAD_CASE: mode,
                  GITHUB_OUTPUT: `${temp}/output`, GITHUB_REPOSITORY: 'example/tracker', RELEASE_PREFIX: 'review-corpus-' }, timeout: 10000 });
              assert.equal(got.error, undefined);
              const accepted = ['first', 'historical', 'modern'].includes(mode);
              assert.equal(got.status, accepted ? 0 : 1, `${mode}: ${got.stderr}`);
              assert.equal(fs.existsSync(`${temp}/decompressed`), accepted && mode !== 'first', mode);
              if (mode.startsWith('corrupt-') || mode.includes('checksum') || mode.endsWith('manifest'))
                assert.match(got.stderr, /missing or mismatched checksum.*restore a verified snapshot/, mode);
            }
          } finally {
            fs.rmSync(temp, { recursive: true, force: true });
          }
          console.log('ok review-corpus resume checksums (offline)');
      # Offline synthetic holdout tests of the splitter kept in docs/review-corpus.md.
      # Keep new scripts inline: deployment scripts and Justfile may only shrink.
      - name: Test review-corpus holdout split
        shell: node {0}
        run: |
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const { execFileSync, spawnSync } = require('node:child_process');
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const test = require('node:test');
          const docs = fs.readFileSync('docs/review-corpus.md', 'utf8');
          const runner = /```sh\nnode -e '([^']+)' -- review-corpus-YYYYMMDD-HHMMSS /.exec(docs)[1];
          const { partition, splitSnapshot, sampleInventory } = new Function('require',
            docs.split('```js split-corpus\n')[1].split('\n```')[0] + '\nreturn { partition, splitSnapshot, sampleInventory };')(require);
          const record = (id, pr, date, extra = {}) => ({ schema_version: 1, kind: 'review-comment',
            repository: 'example/project', pr_number: pr, comment_id: id, created_at: date,
            body: 'synthetic feedback', ...extra });
          const before = '2026-05-31T23:59:59Z';
          const cutoff = '2026-06-01T00:00:00Z';
          const encode = records => Buffer.from(records.map(r => JSON.stringify(r)).join('\n') + '\n');

          test('sampling freezes 30 stratified candidates without feedback or order dependence', () => {
            const rows = Array.from({ length: 80 }, (_, i) => record(i + 1, i + 1, cutoff,
              { language: i < 40 ? 'Rust' : 'C', body: 'HELDOUT_DO_NOT_EXPOSE' }));
            const inventory = JSON.parse(partition(encode(rows)).metadata);
            const bytes = value => Buffer.from(JSON.stringify(value));
            const plan = { seed: 'frozen-example', allocation: { Rust: 15, C: 15 } };
            const result = sampleInventory(bytes(inventory), plan);
            assert.equal(result.prs.length, 30);
            assert.equal(new Set(result.prs.map(pr => pr.url)).size, 30);
            assert.equal(result.available.Rust, 40);
            assert.equal(result.available.C, 40);
            assert.equal(result.prs.filter(pr => pr.language === 'Rust').length, 15);
            assert.equal(result.inventory_sha256, createHash('sha256').update(bytes(inventory)).digest('hex'));
            assert.doesNotMatch(JSON.stringify(result), /HELDOUT_DO_NOT_EXPOSE|first_feedback|inline_languages/);
            assert.deepEqual(sampleInventory(bytes({ ...inventory, prs: [...inventory.prs].reverse() }), plan).prs, result.prs);
            assert.deepEqual(sampleInventory(bytes(inventory), { ...plan, allocation: { C: 15, Rust: 15 } }), result);
            assert.notDeepEqual(sampleInventory(bytes(inventory), { ...plan, seed: 'another-seed' }).prs, result.prs);
            // Inventory is URL-sorted, so select the stratum rather than relying on row positions.
            const rust = inventory.prs.filter(pr => pr.inline_languages.Rust);
            const ranked = rust.map(pr => ({ url: pr.url,
              rank: createHash('sha256').update(JSON.stringify([plan.seed, pr.url])).digest('hex') }))
              .sort((a, b) => a.rank.localeCompare(b.rank)).slice(0, 15).map(pr => pr.url);
            assert.deepEqual(result.prs.filter(pr => pr.language === 'Rust').map(pr => pr.url), ranked);
            const mixed = structuredClone(inventory);
            mixed.prs.forEach(pr => { pr.inline_languages.Rust = 1; pr.inline_languages.C = 1; pr.inline_comments = 2; });
            assert.equal(sampleInventory(bytes(mixed), { ...plan, allocation: { Rust: 30 } }).available.Rust, 80);
            mixed.prs[0].inline_languages.Rust = 0;
            mixed.prs[0].inline_languages.C = 0;
            mixed.prs[0].inline_comments = 0;
            assert.equal(sampleInventory(bytes(mixed), { ...plan, allocation: { Rust: 30 } }).available.Rust, 79);
            for (const mutate of [
              x => { x.prs.push({ ...x.prs[0], url: x.prs[0].url.replace('example', 'Example') }); },
              x => { x.prs[0].body = 'HELDOUT_DO_NOT_EXPOSE'; },
              x => { x.prs[0].inline_comments = 2; },
              x => { x.prs[0].inline_languages.Rust = -1; },
              x => { x.prs[0].first_feedback = before; },
              x => { x.prs[0].first_feedback = '2026-06-31T00:00:00Z'; },
            ]) { const bad = structuredClone(inventory); mutate(bad); assert.throws(() => sampleInventory(bytes(bad), plan)); }
            for (const allocation of [{ Rust: 29 }, { Rust: 31 }, { Rust: 15.5, C: 14.5 }, { invented: 30 }, { Go: 30 }])
              assert.throws(() => sampleInventory(bytes(inventory), { ...plan, allocation }));
            assert.throws(() => sampleInventory(Buffer.from([0xff]), plan), /UTF-8/);
            const temp = fs.mkdtempSync(path.join(os.tmpdir(), 'sample-cli-'));
            try {
              fs.writeFileSync(path.join(temp, 'inventory.json'), bytes(inventory));
              fs.writeFileSync(path.join(temp, 'plan.json'), JSON.stringify(plan));
              const run = () => spawnSync('node', ['-e', runner, '--', '--sample', path.join(temp, 'inventory.json'), path.join(temp, 'plan.json')], { encoding: 'utf8' });
              const ok = run(); assert.equal(ok.status, 0, ok.stderr); assert.deepEqual(JSON.parse(ok.stdout), result);
              fs.writeFileSync(path.join(temp, 'plan.json'), JSON.stringify({ ...plan, allocation: { Go: 30 } }));
              const bad = run(); assert.equal(bad.status, 1); assert.equal(bad.stdout, ''); assert.match(bad.stderr, /insufficient candidates/);
            } finally { fs.rmSync(temp, { recursive: true, force: true }); }
          });

          test('whole PRs split by earliest creation across all kinds, not order or update time', () => {
            const rows = [record(1, 1, cutoff), record(2, 2, cutoff, { body: 'HELDOUT_DO_NOT_EXPOSE' }),
              record(3, 1, before, { kind: 'pr-comment', updated_at: cutoff, repository: 'Example/Project' }),
              record(4, 3, '2026-06-02T00:00:00Z', { kind: 'review-body' }),
              record(5, 3, before, { kind: 'review-body' }),
              record(6, 1, cutoff, { repository: 'other/project' })];
            for (const input of [rows, [...rows].reverse()]) {
              const split = partition(encode(input));
              assert.deepEqual(split.counts, { records: 6, training_records: 4, heldout_records: 2, training_prs: 2, heldout_prs: 2 });
              assert.equal(split.holdout, 'https://github.com/example/project/pull/2\nhttps://github.com/other/project/pull/1\n');
              assert.doesNotMatch(split.training, /HELDOUT_DO_NOT_EXPOSE/);
              assert.deepEqual(JSON.parse('[' + split.training.trim().split('\n').join(',') + ']').map(r => r.comment_id).sort(), [1, 3, 4, 5]);
            }
          });

          test('empty partitions are explicit, malformed metadata is never silently dropped', () => {
            assert.equal(partition(encode([record(1, 1, cutoff)])).training, '');
            assert.equal(partition(encode([record(1, 1, before)])).holdout, '');
            for (const extra of [{ schema_version: 2 }, { kind: 'unknown' }, { repository: '../bad/path' },
              { pr_number: 0 }, { comment_id: Number.MAX_SAFE_INTEGER + 1 }, { body: null },
              { created_at: '2026-02-30T00:00:00Z' }, { created_at: 'not-a-date' },
              { created_at: '2026-06-01' }]) {
              assert.throws(() => partition(encode([record(1, 1, before, extra)])), /invalid metadata/);
            }
            for (const value of [null, [], 1]) assert.throws(() => partition(encode([value])), /invalid metadata/);
            assert.throws(() => partition(encode([record(1, 1, before), record(1, 2, cutoff)])), /duplicate identity/);
            assert.throws(() => partition(Buffer.from('')), /expected 1..250000/);
            assert.throws(() => partition(Buffer.from('{"body":"DO_NOT_ECHO"')), /invalid JSON at record 1$/);
            assert.throws(() => partition(Buffer.alloc(128 * 1024 * 1024 + 1)), /exceeds 128 MiB/);
            assert.throws(() => partition(Buffer.from('\n'.repeat(250002))), /expected 1..250000/);
            assert.throws(() => partition(Buffer.from([0xff])), /encoded data/);
          });

          test('sampling inventory exposes only fixed metadata, independent of record order', () => {
            const hidden = { body: 'HELDOUT_DO_NOT_EXPOSE', path: 'SECRET_PATH', diff_hunk: 'SECRET_HUNK',
              outcome: 'SECRET_OUTCOME', commit_id: 'SECRET_COMMIT', extra: 'SECRET_EXTRA' };
            const rows = [record(1, 2, cutoff, { ...hidden, language: 'Rust' }),
              record(2, 2, cutoff, { ...hidden, language: 'C', repository: 'Example/Project' }),
              record(3, 2, cutoff, { ...hidden, language: 'Shell' }),
              record(4, 2, cutoff, { ...hidden, language: 'Docs' }),
              record(5, 2, cutoff, { ...hidden, language: null }),
              record(6, 2, cutoff, { ...hidden, language: 'SECRET_LANGUAGE' }),
              record(7, 2, cutoff, { ...hidden, language: 'Rust', kind: 'pr-comment' }),
              record(8, 1, '2026-06-02T00:00:00Z', { ...hidden, kind: 'review-body' }),
              record(9, 3, before, { language: 'Python' }),
              record(10, 3, cutoff, { language: 'Go' }),
              record(11, 2, cutoff, { language: 'Python' }),
              record(12, 2, cutoff, { language: 'Go' })];
            const expected = { schema: 'review-checklist.holdout-metadata.v1', prs: [
              { url: 'https://github.com/example/project/pull/1', first_feedback: '2026-06-02T00:00:00Z',
                inline_comments: 0, inline_languages: { Rust: 0, C: 0, shell: 0, Go: 0, Python: 0, docs: 0, other: 0 } },
              { url: 'https://github.com/example/project/pull/2', first_feedback: cutoff,
                inline_comments: 8, inline_languages: { Rust: 1, C: 1, shell: 1, Go: 1, Python: 1, docs: 1, other: 2 } },
            ] };
            const split = partition(encode(rows));
            assert.deepEqual(JSON.parse(split.metadata), expected);
            assert.equal(partition(encode([...rows].reverse())).metadata, split.metadata);
            assert.doesNotMatch(split.metadata, /HELDOUT_DO_NOT_EXPOSE|SECRET_/);
            assert.deepEqual(JSON.parse(partition(encode([record(1, 1, before)])).metadata).prs, []);
            for (const language of [42, [], {}]) {
              assert.throws(() => partition(encode([record(1, 1, cutoff, { language })])), /invalid language at record 1$/);
            }
          });

          test('verified complete snapshot produces isolated files; failed preparation publishes nothing', () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'review-split-test-'));
            const snapshot = path.join(root, 'snapshot');
            const output = path.join(root, 'output');
            const tag = 'review-corpus-20261114-000000';
            const status = { complete: true, stopped_for_quota: false, login: 'cgwalters',
              window: { since: '2020-11-01', until: null }, collector_version: 'v0.1.0',
              run_url: 'https://github.com/cgwalters-forge/tracker/actions/runs/1' };
            const names = ['review-corpus.jsonl.zst', 'review-corpus-state.json', 'status.json'];
            const hash = bytes => createHash('sha256').update(bytes).digest('hex');
            const checksums = () => fs.writeFileSync(path.join(snapshot, 'SHA256SUMS'),
              [...names].reverse().map(name => `${hash(fs.readFileSync(path.join(snapshot, name)))}  ${name}\n`).join(''));
            const reset = (metadata = status, corpus = encode([record(1, 1, before), record(2, 2, cutoff, { body: 'HELDOUT_DO_NOT_EXPOSE' })])) => {
              fs.rmSync(output, { recursive: true, force: true });
              fs.mkdirSync(snapshot, { recursive: true });
              fs.writeFileSync(path.join(snapshot, names[0]), execFileSync('zstd', ['-c'], { input: corpus }));
              fs.writeFileSync(path.join(snapshot, names[1]), '{}');
              fs.writeFileSync(path.join(snapshot, names[2]), JSON.stringify(metadata));
              checksums();
            };
            const refuses = pattern => {
              assert.throws(() => splitSnapshot(tag, snapshot, output), pattern);
              assert.equal(fs.existsSync(output), false);
              assert.deepEqual(fs.readdirSync(root), ['snapshot']);
            };
            try {
              const help = spawnSync(process.execPath, ['-e', runner, '--', '--help'], { encoding: 'utf8' });
              assert.equal(help.status, 0, help.stderr);
              assert.match(help.stdout, /Usage: TAG SNAPSHOT NEW_OUTPUT/);
              reset();
              // The documented command, not just the functions it defines.
              const cli = spawnSync(process.execPath, ['-e', runner, '--', tag, snapshot, output], { encoding: 'utf8' });
              assert.equal(cli.status, 0, cli.stderr);
              assert.equal(JSON.parse(cli.stdout).heldout_prs, 1);
              assert.doesNotMatch(cli.stdout + cli.stderr, /HELDOUT_DO_NOT_EXPOSE/);
              assert.deepEqual(fs.readdirSync(output), ['holdout-metadata.json', 'holdout.txt', 'provenance.json', 'training.jsonl']);
              for (const name of fs.readdirSync(output)) assert.doesNotMatch(fs.readFileSync(path.join(output, name), 'utf8'), /HELDOUT_DO_NOT_EXPOSE/);
              const provenance = JSON.parse(fs.readFileSync(path.join(output, 'provenance.json')));
              assert.equal(provenance.cutoff, cutoff);
              assert.equal(provenance.training_sha256, hash(fs.readFileSync(path.join(output, 'training.jsonl'))));
              assert.equal(provenance.holdout_sha256, hash(fs.readFileSync(path.join(output, 'holdout.txt'))));
              assert.equal(provenance.holdout_metadata_sha256, hash(fs.readFileSync(path.join(output, 'holdout-metadata.json'))));
              const inventory = JSON.parse(fs.readFileSync(path.join(output, 'holdout-metadata.json')));
              assert.equal(inventory.prs.length, provenance.heldout_prs);
              assert.equal(inventory.prs.map(pr => pr.url + '\n').join(''), fs.readFileSync(path.join(output, 'holdout.txt'), 'utf8'));
              for (const name of names) assert.equal(provenance.snapshot_sha256[name], hash(fs.readFileSync(path.join(snapshot, name))));
              assert.throws(() => splitSnapshot(tag, snapshot, output), /output already exists/);
              for (const change of [{ complete: false }, { complete: 'true' }, { stopped_for_quota: true },
                { login: 'someone-else' }, { window: { since: '2026-01-01', until: null } }, { run_url: 'https://example.com' }]) {
                reset({ ...status, ...change });
                refuses(/snapshot must be complete/);
              }
              for (const name of names) {
                reset();
                fs.appendFileSync(path.join(snapshot, name), 'damaged');
                refuses(/checksum/);
              }
              reset();
              fs.writeFileSync(path.join(snapshot, 'SHA256SUMS'), '');
              refuses(/checksum/);
              reset(status, Buffer.from('{"body":"DO_NOT_ECHO"'));
