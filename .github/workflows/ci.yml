              r.groups = [g];
              const got = await run({report: r, index: {[signature]: e}}); assert.ifError(got.error);
              assert.equal(got.files.get('2026-11-05.md').includes('flake_unexplained_over_seven_days'), overdue);
              const absent = await run({index: {[signature]: e}}); assert.ifError(absent.error);
              assert.equal(absent.files.get('2026-11-05.md').includes('Absence does NOT prove recovery'), overdue);
            }
          });
          test('absent overdue flakes retain reviewed follow-up context on every surface', async () => {
            for (const issue of [null, 'https://github.com/cgwalters-forge/tracker/issues/123', '<script>@owner [issue](bad)</script>']) {
              const e = {...entry(8), issue, owner: '<owner>@team'};
              for (const publish of [false, true]) {
                const got = await run({index: {[signature]: e}, publish, preview: false});
                assert.ifError(got.error);
                assert.equal(got.calls.length, publish ? 1 : 0);
                for (const text of [got.files.get('2026-11-05.md'), got.summaries[0], ...(publish ? [got.calls[0].args.body] : [])]) {
                  assert.ok(text.includes(`first seen ${e.first_seen}`));
                  assert.match(text, /owner &#60;owner&#62;&#64;team, fix staged/);
                  assert.ok(text.includes(`issue ${issue === null ? 'none' : issue.startsWith('https:') ? issue : '&#60;script&#62;&#64;owner &#91;issue&#93;&#40;bad&#41;&#60;/script&#62;'}.`));
                  assert.match(text, /Absence does NOT prove recovery/);
                  assert.doesNotMatch(text, /<script>|@team|@owner/);
                }
                assert.deepEqual(JSON.parse(got.files.get('2026-11-05.json')), report());
              }
            }
            for (const e of [{...entry(8), explained_at: iso(until)}, {...entry(8), class: 'infra'}]) {
              const got = await run({index: {[signature]: e}});
              assert.ifError(got.error);
              assert.doesNotMatch(got.files.get('2026-11-05.md'), /overdue absent signature/);
            }
          });
          test('saved live JSON renders offline without another collection', async () => {
            const r = JSON.parse(fs.readFileSync(process.env.CI_HEALTH_SAMPLE ?? 'docs/ci-health-2026-11-13.json'));
            // Historical reports keep their original scope; never delete the
            // failed target from saved evidence to make today's config match.
            const targets = r.targets.map(t => t.target);
            const historical = targets.some(t => t.repository === 'bootc-dev/bcvk' && t.workflow === 'main-c10s.yml');
            if (historical) {
              const expected = config.targets.filter(t => t.workflow !== 'bootc-revdep.yml')
                .map(t => t.repository === 'cgwalters-forge/agenthome' ? {...t, workflow: 'ci.yml'} : t);
              expected.splice(3, 0, {repository: 'bootc-dev/bcvk', workflow: 'main-c10s.yml'});
              assert.deepEqual(targets, expected);
              const refused = await run({report: r, now: Date.parse(r.until) + 12 * 3600000});
              assert.match(refused.error?.message ?? '', /target mismatch/);
              assert.equal(refused.calls.length, 0);
              assert.equal(refused.outputs['dated-ready'], undefined);
            } else assert.deepEqual(targets, config.targets);
            // Replay at collection time, not the canned fixture's fixed date. The
            // production freshness gate still rejects this sample two days later.
            const collectedAt = Date.parse(r.until) + 12 * 3600000;
            const got = await run({report: r, targets, now: collectedAt});
            assert.ifError(got.error); assert.equal(got.calls.length, 0);
            assert.ok(got.files.has(r.until.slice(0, 10) + '.md'));
            assert.match(got.files.get(r.until.slice(0, 10) + '.md'), new RegExp(`fixed ${targets.length}-target baseline`));
            const stale = await run({report: r, targets, now: Date.parse(r.until) + 2 * 86400000});
            assert.match(stale.error?.message ?? '', /invalid\/stale window/);
            assert.equal(stale.calls.length, 0);
          });

  # actionlint, zizmor and the runner-label policy shared by the forge
  # repositories, at the versions its `just check` recipe pins on the
  # actions repository's main, which this follows (#544); `just lint` runs
  # the same recipe locally.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgwalters-forge/actions/lint@main

  # The bounds, runner configuration and pools that dispatch.yml reads from
  # the default branch, and review.yml's bounds: a file that does not parse
  # fails every run after the merge.
  config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse the JSON and TOML files of .github/agentic-job and workflow
        run: |
          python3 - .github/agentic-job/*.json .github/agentic-job/*.toml workflow/*.toml <<'PY'
          import json, sys, tomllib

          failed = False
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as f:
                      (json if path.endswith(".json") else tomllib).load(f)
              except (OSError, ValueError) as e:
                  failed = True
                  print(f"::error file={path}::{e}")
              else:
                  print(f"ok {path}")
          sys.exit(failed)
          PY

  # The deployment code may only shrink (#890): a change fails if it adds
  # any file but a workflow, JSON, TOML, markdown or the config test crate's
  # test source and lockfile, or if it grows the
  # line count of the .cjs and .sh files and the Justfile, so a fix deletes at
  # least as many lines as it adds. Renames count as an add and a delete.
  shrink:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse new scripts and growth of the .cjs and .sh files and the Justfile
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          added=$(git diff --no-renames --diff-filter=A --name-only "$BASE" HEAD |
            grep -vE '^\.github/workflows/[^/]+\.ya?ml$|\.(json|toml|md)$|^(LICENSE(-[A-Z]+)?|COPYING)$|^\.github/agentic-job/config-test/(tests/config\.rs|Cargo\.lock)$' || true)
          if [ -n "$added" ]; then
            awk '{ print "::error::adds a script file: " $0 }' <<< "$added"
            exit 1
          fi
          growth=$(git diff --no-renames --numstat "$BASE" HEAD |
            awk -F'\t' '$3 ~ /\.(cjs|sh)$/ || $3 == "Justfile" { n += $1 - $2 } END { print n + 0 }')
          echo "net lines added to .cjs and .sh files and the Justfile: $growth"
          if [ "$growth" -gt 0 ]; then
            echo "::error::grows the .cjs and .sh files and the Justfile by $growth lines; delete at least as many as you add"
            exit 1
          fi

  # Require only ci in the ruleset, on both PR and merge-group commits.
  ci:
    if: ${{ always() }}
    needs: [test, lint, config, shrink]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
