# Checks of this repository's own automation, so a pull request that edits
# `.github/` is tested before it merges. The one job named ci is what the
# main branch ruleset requires: a new check is added to its `needs`, with
# no change to the ruleset.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tests of the scripts under .github, through the Justfile.
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hosted image's Node; the scripts have no dependencies to install.
      # A pinned just: Ubuntu's apt carries an old one (1.21 on 24.04).
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - name: Build the supervisor's pinned config validator
        run: just build-supervisor-agent-board
      - run: just test
        env:
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board

  # actionlint, zizmor and the runner-label policy shared by the forge
  # repositories, at the versions its `just check` recipe pins on the
  # actions repository's main, which this follows (#544); `just lint` runs
  # the same recipe locally.
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cgwalters-forge/actions/lint@main

  # The bounds, runner configuration and pools that dispatch.yml reads from
  # the default branch, and review.yml's bounds: a file that does not parse
  # fails every run after the merge.
  config:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Parse the JSON and TOML files of .github/agentic-job and workflow
        run: |
          python3 - .github/agentic-job/*.json .github/agentic-job/*.toml workflow/*.toml <<'PY'
          import json, sys, tomllib

          failed = False
          for path in sys.argv[1:]:
              try:
                  with open(path, "rb") as f:
                      (json if path.endswith(".json") else tomllib).load(f)
              except (OSError, ValueError) as e:
                  failed = True
                  print(f"::error file={path}::{e}")
              else:
                  print(f"ok {path}")
          sys.exit(failed)
          PY

  # The deployment code may only shrink (#890): a change fails if it adds
  # any file but a workflow, JSON, TOML or markdown, or if it grows the
  # line count of the .cjs and .sh files, so a fix to a script deletes at
  # least as many lines as it adds. Renames count as an add and a delete.
  shrink:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse new scripts and growth of the .cjs and .sh files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          added=$(git diff --no-renames --diff-filter=A --name-only "$BASE" HEAD |
            grep -vE '^\.github/workflows/[^/]+\.ya?ml$|\.(json|toml|md)$' || true)
          if [ -n "$added" ]; then
            awk '{ print "::error::adds a script file: " $0 }' <<< "$added"
            exit 1
          fi
          growth=$(git diff --no-renames --numstat "$BASE" HEAD |
            awk -F'\t' '$3 ~ /\.(cjs|sh)$/ { n += $1 - $2 } END { print n + 0 }')
          echo "net lines added to .cjs and .sh files: $growth"
          if [ "$growth" -gt 0 ]; then
            echo "::error::grows the .cjs and .sh files by $growth lines; delete at least as many as you add"
            exit 1
          fi

  # Require only ci in the ruleset, on both PR and merge-group commits.
  ci:
    if: ${{ always() }}
    needs: [test, lint, config, shrink]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
