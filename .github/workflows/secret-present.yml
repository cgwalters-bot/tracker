# Diagnostic: says which candidate secret names are set for this repository. Prints yes/no only.
name: secret-present
on: workflow_dispatch
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          A: ${{ secrets.CGWALTERS_BOT_PAT != '' }}
          B: ${{ secrets.SAFE_OUTPUTS_PAT != '' }}
          C: ${{ secrets.CGWALTERS_BOT_PAT_READONLY != '' }}
          D: ${{ secrets.CGWALTERS_BOT_TOKEN != '' }}
        run: |
          echo "CGWALTERS_BOT_PAT=$A SAFE_OUTPUTS_PAT=$B CGWALTERS_BOT_PAT_READONLY=$C CGWALTERS_BOT_TOKEN=$D"
