name: broker-probe
on:
  schedule:
    - cron: '*/15 * * * *'
permissions: {}
# The same reviewed agent-board commit as supervisor.yml's.
env:
  AGENT_BOARD_REV: a9f2500e82e912559fa98f559b8e0762590e758f
concurrency:
  group: broker-probe
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ vars.BROKER_OUTAGE == 'apply' }}
    runs-on: ubuntu-26.04
    # Verified download, then the probe's few requests.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      # Verify CI provenance and digests before joining the tailnet or using
      # the PAT; never follow agent-board's moving branch.
      - name: Install verified agent-board at the pinned revision
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: Join the dispatch tailnet
        id: tailnet
        uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: broker-probe-${{ github.run_id }}-${{ github.run_attempt }}
      # The probe reads the broker's url only from its config, so the
      # committed file gets this run's address added.
      - name: Probe and report
        env:
          # PAT: the probe reads its login from GET /user, which the job token cannot call, and only the bot's outage issue counts.
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL || steps.tailnet.outputs.proxy }}
        run: |
          jq --arg url "$INFERENCE_URL" '. + {url: $url}' .github/broker/config.json > "$RUNNER_TEMP/broker.json"
          "$RUNNER_TEMP/agent-board/bin/agent-board" broker probe --config "$RUNNER_TEMP/broker.json" --apply
