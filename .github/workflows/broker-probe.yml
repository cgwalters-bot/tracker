name: broker-probe
on:
  schedule:
    - cron: '*/15 * * * *'
permissions: {}
# The same reviewed agent-board commit as supervisor.yml's.
env:
  AGENT_BOARD_REV: bc7a2b925fbf133d52498543d4f8adaef9aa4cb0
concurrency:
  group: broker-probe
  cancel-in-progress: false
jobs:
  probe:
    if: ${{ vars.BROKER_OUTAGE == 'apply' }}
    runs-on: ubuntu-26.04
    # Build (10), then the probe's few requests.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      # Built fresh at the pin, never a release binary or agent-board's
      # moving branch: only a reviewed revision runs with the PAT. Before
      # the join, so the dependencies' build scripts never reach the tailnet.
      - name: Build agent-board at the pinned revision
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: Join the dispatch tailnet
        id: tailnet
        uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: broker-probe-${{ github.run_id }}-${{ github.run_attempt }}
      # The probe reads the broker's url only from its config, so the
      # committed file gets this run's address added.
      - name: Probe and report
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          INFERENCE_URL: ${{ vars.INFERENCE_URL || steps.tailnet.outputs.proxy }}
        run: |
          jq --arg url "$INFERENCE_URL" '. + {url: $url}' .github/broker/config.json > "$RUNNER_TEMP/broker.json"
          "$RUNNER_TEMP/agent-board/bin/agent-board" broker probe --config "$RUNNER_TEMP/broker.json" --apply
