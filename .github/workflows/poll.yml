# One `agent-board pass` (agent-board's docs/pass.md): follows the bot's pull
# requests, refreshes usage from the broker, plans and applies the operator's
# epics, starts board work by Priority, WIP and pace, and derives board
# Status. The configuration is .github/pass.json on the default branch.
name: poll
run-name: pass${{ inputs.apply && ' (apply)' || '' }}

# The clock is the `next` job: each applying pass starts the next one
# PASS_INTERVAL_MINUTES after its own start, and `next-fallback` stands in
# when `next` fails or GitHub never creates it, or when GitHub cancels a
# started pass for its timeout or a lost runner. There is no schedule: GitHub
# dropped most scheduled runs, and a waiting scheduled run counts as a newer
# chain owner. A lost chain can restart from the scheduled pin workflow or a
# manual dispatch. Its disposable response cache comes from a validated
# applying predecessor; bootstrap runs discover one.
# Living status stays disabled until replay records have access-controlled durable storage.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Take the steps; otherwise only preview
        type: boolean
        default: false
      previous_run_id:
        description: Preceding applying poll run (empty discovers a trusted predecessor)
        type: string
        required: false
        default: ''

permissions: {}
# The agent-board commit the pass runs. It is given the bot's token, so it is
# a revision reviewed here, never agent-board's moving branch: move it only
# with a review of what that revision's `pass` does.
env:
  AGENT_BOARD_REV: 7abb06c911c27699e9cbb44d59d04d865e906d74
  # Minutes from one applying pass's start to the next, for `next` and its
  # recovery alike; a pass makes about 2,000 of the bot's hourly requests.
  # The supervisor's usageStaleMinutes must stay above it, with slack.
  PASS_INTERVAL_MINUTES: 45

jobs:
  pass:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # One pass at a time; one that is due while another runs waits for it,
    # and a group keeps only the newest waiting run. The group is the job's,
    # not the workflow's, so `next` waiting out its interval holds nothing.
    # Previews wait in their own group: one there could otherwise replace a
    # queued applying successor, and with no schedule the chain would stop.
    concurrency:
      group: ${{ inputs.apply && 'pass' || 'pass-preview' }}
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # The build (10), the join (3) and the pass's own bound (15, plus two
    # to finish its writes), with room for checkout and setup.
    timeout-minutes: 40
    # `actions: write` starts dispatch.yml and review.yml runs with the job
    # token; the identity token is the tailnet join's.
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A GitHub release outage (504s for over an hour on 2026-11-08) must not
      # stop the job: build the same just from crates.io instead.
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # Built each pass and never cached: a cache any job on the default
      # branch can write is not where a binary given the bot's token should
      # come from.
      - name: Install verified agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      # Stage 2 reads the broker's /usage over the tailnet. Without the
      # join the pass runs without usage.url, pacing on the published
      # snapshot, rather than failing on a broker it cannot reach.
      - name: Join the tailnet
        id: tailnet
        continue-on-error: true
        timeout-minutes: 3
        uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: pass-${{ github.run_id }}-${{ github.run_attempt }}
      # The broker's address stays in the variable the agent job, the
      # broker probe and the tailnet test read (else the organization's
      # tailnet setting), not in a second copy in pass.json.
      - name: Configuration
        env:
          INFERENCE_URL: >-
            ${{ steps.tailnet.outcome == 'success' && (vars.INFERENCE_URL || steps.tailnet.outputs.proxy) || '' }}
        run: |
          base=${INFERENCE_URL%/}
          base=${base%/v1}
          jq --arg base "$base" 'if $base == "" then . else .usage.url = "\($base)/usage" end' \
            .github/pass.json > "$RUNNER_TEMP/pass.json"
      # Threat: a forged cached body can steer scheduling even with a valid
      # ETag. Validate the named or discovered applying run after its pass job ends.
      - name: Validate predecessor
        id: predecessor
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: just pass-state validate
      - name: Restore pass state
        id: restore
        if: steps.predecessor.outputs.run-id != ''
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.predecessor.outputs.run-id }}
          name: pass-state
          path: .state
      - name: Start cold after an unreadable artifact
        if: steps.restore.outcome == 'failure'
        run: rm -rf .state
      - name: Prepare state directory
        run: mkdir -p .state
      - name: One pass
        id: pass
        timeout-minutes: 18
        env:
          # The bot's token: it reads the organization's board and the
          # private usage issue, and makes the pass's writes.
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
          # A scheduled pass applies once the operator sets PASS_APPLY; a
          # pass started by hand applies only when asked to.
          APPLY: >-
            ${{ ((github.event_name == 'schedule' && vars.PASS_APPLY == 'enabled') ||
            (github.event_name == 'workflow_dispatch' && inputs.apply)) && '--apply' || '' }}
        shell: bash
        # The caps of the first scheduled passes, until they have been
        # watched; stderr too, so that the summary says why a pass failed.
        # Dispatch picks one fix bounds file per target, so the pass needs both.
        run: |
          "$AGENT_BOARD" pass --config "$RUNNER_TEMP/pass.json" ${APPLY:+"$APPLY"} \
            --fix-bounds .github/agentic-job/fix.toml \
            --fix-bounds .github/agentic-job/midstream-fix.toml \
            --max-dispatch 20 --max-writes 60 --max-status-changes 50 2>&1 | tee "$RUNNER_TEMP/pass.log"
      # Threat: raw state includes private usage/holds comments and status records.
      # Export only allowed responses in public repositories; never replay records.
      - name: Prepare public pass state
        id: state
        if: >-
          ${{ !cancelled() && (steps.pass.outcome == 'success' || steps.pass.outcome == 'failure') &&
          ((github.event_name == 'schedule' && vars.PASS_APPLY == 'enabled') ||
          (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: just pass-state export
      - name: Upload pass state
        if: ${{ !cancelled() && steps.state.outcome == 'success' }}
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pass-state
          path: .state/public/pass.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore
      # GitHub drops agent-board-pin.yml's hourly runs too, so the pass starts
      # it when agent-board's head is not the pin and has no pin PR yet (the
      # title is the one `just bump-agent-board` gives it); the pin workflow
      # checks CI and stays idempotent, and its schedule is the fallback.
      # Threat: these two in-org reads do not need the long-lived bot writer
      # credential. Opt in only after the org's tracker-poll-reads policy lands;
      # an enabled exchange failure must not fall back to the PAT.
      - name: Mint the poll read token
        id: poll-read-token
        if: ${{ !cancelled() && vars.AGENT_BOARD_PIN == 'enabled' && vars.POLL_READ_STS_DOMAIN != '' }}
        timeout-minutes: 1
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          domain: ${{ vars.POLL_READ_STS_DOMAIN }}
          scope: cgwalters-forge
          identity: tracker-poll-reads
      - name: Start the agent-board pin bump
        if: ${{ !cancelled() && vars.AGENT_BOARD_PIN == 'enabled' && (vars.POLL_READ_STS_DOMAIN == '' || steps.poll-read-token.outcome == 'success') }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ vars.POLL_READ_STS_DOMAIN == '' && secrets.CGWALTERS_BOT_PAT || steps.poll-read-token.outputs.token }}
          DISPATCH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          [[ -n $GH_TOKEN ]] || { echo '::error::missing poll read token'; exit 1; }
          source=$(jq -er .source .github/poll/agent-board.json)
          branch=$(jq -er .branch .github/poll/agent-board.json)
          bot=$(jq -er .bot .github/poll/agent-board.json)
          head=$(gh api "repos/${source#https://github.com/}/commits/$branch" --jq .sha)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head for $source $branch"; exit 1; }
          if [[ $head == "$AGENT_BOARD_REV" ]]; then echo "the pin is $branch's head"; exit 0; fi
          title="workflows: Move agent-board to ${head:0:7}"
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --author "$bot" --head agent-board-pin --state open --json title --jq '.[0].title // ""')
          if [[ $open == "$title" ]]; then echo "already proposed: $title"; exit 0; fi
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run agent-board-pin.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Pass'
            echo '<pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$RUNNER_TEMP/pass.log" 2>/dev/null || echo 'No pass ran'
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

  next:
    needs: pass
    # Only an applying pass continues the chain, whether it passed or failed
    # (`!cancelled()`, else GitHub adds an implicit `success()`);
    # a preview by hand never starts one. A newer `next` replaces a waiting
    # one, but two chains offset by a few minutes never wait at once (#1019),
    # so before dispatching `next` also stops if a newer applying run on the
    # default branch is still to finish: that run continues the chain. A run
    # arriving between the check and the dispatch, or the newer run failing
    # to continue, can still leave two chains or none. Setting PASS_APPLY to
    # anything but `enabled` also disables scheduled recovery. While
    # it waits, `next` keeps a hosted runner busy for up to an interval per
    # pass. While RELEASE_TRAIN is `dry-run` or `apply`, `next` also starts
    # release-train.yml when its newest run is an hour old or absent, since
    # GitHub drops its hourly schedule too; the train's own gate and
    # concurrency still decide what that run does. Supervisor wakes use a
    # thirty-minute threshold. With MAINTAIN_SHADOW `enabled`, `next` also
    # starts maintain-shadow.yml when its newest default-branch run is at
    # least thirty minutes old or absent; failures only warn. Its cron is
    # the fallback, and its preview keeps its own read-only job token.
    concurrency:
      group: pass-next
      cancel-in-progress: true
    if: >-
      ${{ !cancelled() && (needs.pass.result == 'success' || needs.pass.result == 'failure') && vars.PASS_APPLY == 'enabled' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || inputs.apply) }}
    runs-on: ubuntu-26.04
    # The verified download, the interval's wait, and the pinned dispatch's
    # retries, whose backoff adds to each request's own timeout: without a
    # schedule, a deadline that cuts them off stops the chain.
    timeout-minutes: 120
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A GitHub release outage (504s for over an hour on 2026-11-08) must not
      # stop the job: build the same just from crates.io instead.
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install verified agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: Start the shadow poll if stale
        if: ${{ vars.MAINTAIN_SHADOW == 'enabled' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          if latest=$(timeout 30s gh run list --workflow maintain-shadow.yml --branch "$DEFAULT_BRANCH" --limit 1 --json createdAt --jq '.[0].createdAt // empty'); then
            if [[ -z $latest ]] || (( $(date +%s) - $(date -d "$latest" +%s) >= 1800 )); then
              timeout 30s gh workflow run maintain-shadow.yml --ref "$DEFAULT_BRANCH" || echo '::warning::Could not start maintain-shadow.yml'
            fi
          else
            echo '::warning::Could not check maintain-shadow.yml age'
          fi
      - name: Start promote if overdue
        # A second dispatch can replace a pending run in promote's concurrency
        # group. Check for active runs even if the newest run has finished.
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: node {0}
        run: |
          const { readFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const { GITHUB_REPOSITORY: repo, DEFAULT_BRANCH: branch } = process.env;
          const gh = args => execFileSync('gh', args, { encoding: 'utf8', timeout: 10_000 });
          function list(filter) {
            const { total_count: count, workflow_runs: runs } = JSON.parse(gh([
              'api', '--method', 'GET', `repos/${repo}/actions/workflows/promote.yml/runs`, '-f', 'per_page=1', '-f', filter,
            ]));
            if (!Number.isSafeInteger(count) || count < 0 || !Array.isArray(runs) || runs.length !== Math.min(count, 1)) {
              throw new Error('invalid promote run listing');
            }
            return runs;
          }
          function overdue() {
            const [latest] = list(`branch=${branch}`);
            if (latest === undefined) return true;
            if (latest?.status !== 'completed') return false;
            const created = typeof latest.created_at === 'string' ? Date.parse(latest.created_at) : NaN;
            if (!Number.isFinite(created)) throw new Error('invalid promote run creation time');
            return Date.now() - created > 60 * 60_000;
          }
          function wake() {
            if (JSON.parse(readFileSync('.github/pass.json', 'utf8')).promote?.publish !== true || !overdue()) return;
            for (const status of ['queued', 'waiting', 'pending', 'requested', 'in_progress']) {
              if (list(`status=${status}`).length) return;
            }
            // Catch a new cron run that arrived during the status checks.
            if (!overdue()) return;
            console.log('Dispatching promote.yml: no active or recent run.');
            gh(['workflow', 'run', 'promote.yml', '--repo', repo, '--ref', branch]);
          }
          wake();
      - name: Start the next pass an interval after this one started
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SUPERVISOR: ${{ vars.SUPERVISOR }}
          RELEASE_TRAIN: ${{ vars.RELEASE_TRAIN }}
        shell: bash
        run: |
          supervisor=()
          if [[ $SUPERVISOR == preview || $SUPERVISOR == apply ]]; then
            supervisor=(--supervisor-workflow supervisor.yml --supervisor-stale-minutes 30
              --supervisor-input prompt= --supervisor-input session=false)
          fi
          train=()
          if [[ $RELEASE_TRAIN == dry-run || $RELEASE_TRAIN == apply ]]; then
            train=(--train-workflow release-train.yml --train-stale-minutes 60)
          fi
          "$RUNNER_TEMP/agent-board/bin/agent-board" pass next --workflow poll.yml \
            --branch "$DEFAULT_BRANCH" --input apply=true --input "previous_run_id=$GITHUB_RUN_ID" --apply-title 'pass (apply)' \
            --wait-minutes "$PASS_INTERVAL_MINUTES" "${supervisor[@]}" "${train[@]}"

  # Best-effort recovery when `next` fails or never runs, including a missing
  # `pass`. Use only runner tools and one dispatch attempt; there is no further
  # recovery job. Dropped GitHub schedules/jobs still prevent a within-one-
  # interval guarantee. Previews never recover. A cancelled pass recovers only
  # when it started and GitHub ended it (job timeout or lost runner); a run
  # replaced while pending or cancelled by hand does not. `!cancelled()` holds
  # after a dependency times out (observed, not documented) and turns false
  # when the run is cancelled, which also stops a recovery already running.
  next-fallback:
    needs: [pass, next]
    if: >-
      ${{ !cancelled() &&
      (needs.next.result == 'failure' || needs.next.result == 'skipped' || needs.next.result == '' || needs.next.result == 'cancelled') &&
      vars.PASS_APPLY == 'enabled' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply)) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 55
    # `checks: read` reads the cancelled pass job's annotations.
    permissions:
      actions: write
      checks: read
    steps:
      - name: Recover the next pass
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PASS_RESULT: ${{ needs.pass.result }}
          NEXT_RESULT: ${{ needs.next.result }}
        shell: bash
        run: |
          printf 'Recovery dependencies: pass=<%s> next=<%s>\n' "$PASS_RESULT" "$NEXT_RESULT"
          # Threat: recovering a replaced or hand-cancelled run restarts a chain
          # someone stopped. GitHub's failure annotation on the started pass job
          # decides. A step can write the same text, so this is a heuristic: it
          # must be the whole message, and any cancel annotation vetoes it.
          # The same holds for `next`; the separate scheduled check can later restart it.
          if [[ $PASS_RESULT == cancelled || $NEXT_RESULT == cancelled ]]; then
            name=pass; [[ $PASS_RESULT == cancelled ]] || name=next
            job=$(timeout 30s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" -f filter=latest \
              --jq "first(.jobs[] | select(.name == \"$name\" and .started_at != null) | .id) // empty")
            [[ -n $job ]] || { echo "the $name job never started; not recovering"; exit 0; }
            ended=$(timeout 30s gh api --method GET "repos/$GITHUB_REPOSITORY/check-runs/$job/annotations" -f per_page=100 \
              --jq '[.[] | select(.annotation_level == "failure") | .message] |
                any(test("^The job (running on runner .+ )?has exceeded the maximum execution time of [^ ]+( minutes)?\\.?$|^The (self-)?hosted runner: [^\n]+ lost communication with the server\\.( |$)")) and
                (any(test("canceled by|higher priority")) | not)')
            [[ $ended == true ]] || { echo "the $name job was cancelled, not ended by GitHub; not recovering"; exit 0; }
          fi
          started=$(timeout 30s gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          [[ -n $started && $started != null ]] || { echo '::error::missing run start time' >&2; exit 1; }
          started_epoch=$(date -d "$started" +%s)
          delay=$(( started_epoch + PASS_INTERVAL_MINUTES * 60 - $(date +%s) ))
          if (( delay > PASS_INTERVAL_MINUTES * 60 )); then delay=$(( PASS_INTERVAL_MINUTES * 60 )); fi
          if (( delay > 0 )); then sleep "$delay"; fi
          # Threat: a recovered old run can fork an already-owned chain. Match
          # pinned pass next's branch, event/title, active statuses, creation-time
          # and ID ordering, and fail if this run is outside its 200-run bound.
          runs=''
          for page in 1 2; do
            # Full run pages can exceed Linux's per-argument limit. Read one
            # response on stdin and retain only the fields the check uses.
            listed=$(timeout 30s gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/poll.yml/runs" \
              -f branch="$DEFAULT_BRANCH" -f exclude_pull_requests=true -f per_page=100 -f page="$page" |
              jq -ces 'if length == 1 and (.[0].workflow_runs | type) == "array"
                then .[0].workflow_runs | map({id, head_branch, status, event, created_at, display_title})
                else error("expected one response with a workflow_runs array") end')
            runs+="$listed"$'\n'
            if jq -e --argjson id "$GITHUB_RUN_ID" 'any(.[]; .id == $id)' <<< "$listed" >/dev/null; then break; fi
            if (( $(jq 'length' <<< "$listed") < 100 )); then break; fi
          done
          newer=$(jq -rs --argjson id "$GITHUB_RUN_ID" --arg branch "$DEFAULT_BRANCH" '
            def created: .created_at | fromdateiso8601;
            add |
            map(if (.id | type) == "number" and
              all(.head_branch, .status, .event, .created_at; type == "string") and
              (.event != "workflow_dispatch" or (.display_title | type) == "string")
              then (created as $at | .) else error("invalid workflow run") end) |
            (map(select(.id == $id))[0] // error("current run absent from bounded listing")) as $me |
            first(.[] | select(.id != $id and .head_branch == $branch and
              (.status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested" or .status == "in_progress") and
              (.event == "schedule" or (.event == "workflow_dispatch" and .display_title == "pass (apply)")) and
              ([created, .id] > [($me | created), $id])) | .id) // empty' <<< "$runs")
          if [[ -n $newer ]]; then echo "run $newer continues the chain; not starting another"; exit 0; fi
          timeout 30s gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" -f apply=true -f "previous_run_id=$GITHUB_RUN_ID"
