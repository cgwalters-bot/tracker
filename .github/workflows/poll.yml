# One `agent-board pass` (agent-board's docs/pass.md): follows the bot's pull
# requests, refreshes usage from the broker, plans and applies the operator's
# epics, starts board work by Priority, WIP and pace, and derives board
# Status. The configuration is .github/pass.json on the default branch.
name: poll
run-name: pass${{ inputs.apply && ' (apply)' || '' }}

# The clock is the `next` job: each applying pass starts the next one ten
# minutes after its own start. GitHub drops most `*/10` scheduled runs, so
# the schedule only restarts a broken chain; a pass keeps no state of its
# own, so a late or dropped one costs nothing but time.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Take the steps; otherwise only preview
        type: boolean
        default: false

permissions: {}
# The agent-board commit the pass runs. It is given the bot's token, so it is
# a revision reviewed here, never agent-board's moving branch: move it only
# with a review of what that revision's `pass` does.
env:
  AGENT_BOARD_REV: a9ebe704e7bd0787442d6cf81434ccc134fc3ac9

jobs:
  pass:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    # One pass at a time; one that is due while another runs waits for it,
    # and a group keeps only the newest waiting run. The group is the job's,
    # not the workflow's, so `next` waiting out its ten minutes holds nothing.
    concurrency:
      group: pass
      cancel-in-progress: false
    runs-on: ubuntu-26.04
    # The build (10), the join (3) and the pass's own bound (15, plus two
    # to finish its writes), with room for checkout and setup.
    timeout-minutes: 40
    # `actions: write` starts dispatch.yml and review.yml runs with the job
    # token; the identity token is the tailnet join's.
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      # Built each pass and never cached: a cache any job on the default
      # branch can write is not where a binary given the bot's token should
      # come from.
      - name: Build agent-board
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      # Stage 2 reads the broker's /usage over the tailnet. Without the
      # join the pass runs without usage.url, pacing on the published
      # snapshot, rather than failing on a broker it cannot reach.
      - name: Join the tailnet
        id: tailnet
        continue-on-error: true
        timeout-minutes: 3
        uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: pass-${{ github.run_id }}-${{ github.run_attempt }}
      # The broker's address stays in the variable the agent job, the
      # broker probe and the tailnet test read (else the organization's
      # tailnet setting), not in a second copy in pass.json.
      - name: Configuration
        env:
          INFERENCE_URL: >-
            ${{ steps.tailnet.outcome == 'success' && (vars.INFERENCE_URL || steps.tailnet.outputs.proxy) || '' }}
        run: |
          base=${INFERENCE_URL%/}
          base=${base%/v1}
          jq --arg base "$base" 'if $base == "" then . else .usage.url = "\($base)/usage" end' \
            .github/pass.json > "$RUNNER_TEMP/pass.json"
      - name: One pass
        timeout-minutes: 18
        env:
          # The bot's token: it reads the organization's board and the
          # private usage issue, and makes the pass's writes.
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
          # A scheduled pass applies once the operator sets PASS_APPLY; a
          # pass started by hand applies only when asked to.
          APPLY: >-
            ${{ ((github.event_name == 'schedule' && vars.PASS_APPLY == 'enabled') ||
            (github.event_name == 'workflow_dispatch' && inputs.apply)) && '--apply' || '' }}
        shell: bash
        # The caps of the first scheduled passes, until they have been
        # watched; stderr too, so that the summary says why a pass failed.
        run: |
          "$AGENT_BOARD" pass --config "$RUNNER_TEMP/pass.json" ${APPLY:+"$APPLY"} \
            --max-dispatch 8 --max-writes 20 --max-status-changes 50 2>&1 | tee "$RUNNER_TEMP/pass.log"
      # GitHub drops agent-board-pin.yml's hourly runs too, so the pass starts
      # it when agent-board's head is not the pin and has no pin PR yet (the
      # title is the one `just bump-agent-board` gives it); the pin workflow
      # checks CI and stays idempotent, and its schedule is the fallback.
      - name: Start the agent-board pin bump
        if: ${{ !cancelled() && vars.AGENT_BOARD_PIN == 'enabled' }}
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          source=$(jq -er .source .github/poll/agent-board.json)
          branch=$(jq -er .branch .github/poll/agent-board.json)
          bot=$(jq -er .bot .github/poll/agent-board.json)
          head=$(gh api "repos/${source#https://github.com/}/commits/$branch" --jq .sha)
          [[ $head =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no head for $source $branch"; exit 1; }
          if [[ $head == "$AGENT_BOARD_REV" ]]; then echo "the pin is $branch's head"; exit 0; fi
          title="workflows: Move agent-board to ${head:0:7}"
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --author "$bot" --head agent-board-pin --state open --json title --jq '.[0].title // ""')
          if [[ $open == "$title" ]]; then echo "already proposed: $title"; exit 0; fi
          GH_TOKEN=$DISPATCH_TOKEN gh workflow run agent-board-pin.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Pass'
            echo '<pre>'
            sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$RUNNER_TEMP/pass.log" 2>/dev/null || echo 'No pass ran'
            echo '</pre>'
          } >> "$GITHUB_STEP_SUMMARY"

  next:
    needs: pass
    # Only an applying pass continues the chain, whether it passed or failed
    # (`!cancelled()`, else GitHub adds an implicit `success()`);
    # a preview by hand never starts one. A newer `next` replaces a waiting
    # one, but two chains offset by a few minutes never wait at once (#1019),
    # so before dispatching `next` also stops if a newer applying run on the
    # default branch is still to finish: that run continues the chain. A run
    # arriving between the check and the dispatch, or the newer run failing
    # to continue, can still leave two chains or none. Setting PASS_APPLY to
    # anything but `enabled`, or cancelling the waiting run, ends it. While
    # it waits, `next` keeps a hosted runner busy for up to ten minutes per
    # pass.
    concurrency:
      group: pass-next
      cancel-in-progress: true
    if: >-
      ${{ !cancelled() && (needs.pass.result == 'success' || needs.pass.result == 'failure') && vars.PASS_APPLY == 'enabled' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'schedule' || inputs.apply) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - name: Start the next pass ten minutes after this one started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { setTimeout: sleep } = require('node:timers/promises');
          const { GITHUB_REPOSITORY: repo, RUN_ID, DEFAULT_BRANCH: branch } = process.env;
          const id = Number(RUN_ID);
          const delays = [2000, 4000, 8000];
          // A transient API failure must not end the chain. Bound each gh process
          // (including both listing pages) to five seconds, and each operation to
          // four attempts. Worst case: 24 calls + six backoff sequences = 204s,
          // plus at most 600s waiting, leaving 96s of the 15-minute job budget.
          const gh = (...args) => execFileSync('gh', args, {
            encoding: 'utf8', timeout: 5000, killSignal: 'SIGKILL',
            stdio: ['ignore', 'pipe', 'pipe'],
          });
          async function retry(name, operation) {
            for (let attempt = 0; ; attempt++) {
              try { return await operation(); }
              catch (error) {
                console.error(`${name} attempt ${attempt + 1}/4: ${error.message}`);
                if (attempt === delays.length) throw new Error(`${name} exhausted four attempts`);
                await sleep(delays[attempt]);
              }
            }
          }
          const timestamp = value => typeof value === 'string' &&
            /^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?Z$/.test(value) && Number.isFinite(Date.parse(value));
          async function newerRun() {
            return retry('runs listing', () => {
              const runs = JSON.parse(gh('run', 'list', '--repo', repo, '--workflow', 'poll.yml',
                '--branch', branch, '--limit', '200', '--json', 'databaseId,status,createdAt,event,displayTitle,headBranch'));
              // Never treat an incomplete/malformed response as absence of a successor.
              if (!Array.isArray(runs) || !runs.every(r => r && Number.isSafeInteger(r.databaseId) &&
                  r.databaseId > 0 && timestamp(r.createdAt) &&
                  ['status', 'event', 'displayTitle', 'headBranch'].every(key => typeof r[key] === 'string'))) {
                throw new Error('malformed runs listing');
              }
              // Applying runs are schedules (PASS_APPLY is enabled here) and
              // dispatches marked by run-name. The newest 200 must include us.
              const me = runs.find(r => r.databaseId === id);
              if (!me) throw new Error(`run ${id} is not among the newest runs`);
              return runs.find(r => r.databaseId !== id && r.headBranch === branch &&
                ['queued', 'waiting', 'pending', 'requested', 'in_progress'].includes(r.status) &&
                (r.event === 'schedule' || (r.event === 'workflow_dispatch' && r.displayTitle === 'pass (apply)')) &&
                (Date.parse(r.createdAt) > Date.parse(me.createdAt) ||
                  (Date.parse(r.createdAt) === Date.parse(me.createdAt) && r.databaseId > id)));
            });
          }
          async function main() {
            const start = await retry('run-start lookup', () => {
              const value = gh('api', `repos/${repo}/actions/runs/${RUN_ID}`, '--jq', '.run_started_at').trim();
              if (!timestamp(value)) throw new Error('missing or malformed run start time');
              return Date.parse(value);
            });
            const wait = Math.min(600000, start + 600000 - Date.now());
            if (wait > 0) await sleep(wait);
            for (let attempt = 0; ; attempt++) {
              // Dispatch has no exactly-once guarantee: GitHub may accept it but
              // return an error. Refresh before every attempt, including retries.
              // A successor not yet visible can still cause a duplicate chain.
              const newer = await newerRun();
              if (newer) {
                console.log(`run ${newer.databaseId} continues the chain; not starting another`);
                return;
              }
              try {
                gh('workflow', 'run', 'poll.yml', '--repo', repo, '--ref', branch, '-f', 'apply=true');
                return;
              } catch (error) {
                console.error(`workflow dispatch attempt ${attempt + 1}/4: ${error.message}`);
                if (attempt === delays.length) throw new Error('workflow dispatch exhausted four attempts');
                await sleep(delays[attempt]);
              }
            }
          }
          main().catch(error => { console.error(`::error::${error.message}`); process.exitCode = 1; });
          NODE
