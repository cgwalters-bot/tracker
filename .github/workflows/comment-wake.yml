name: Comment wake

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  config:
    # Opt in only after deployment. PR comments and bot replies must not wake
    # privileged automation, and no event text or event ref is executed.
    if: ${{ vars.COMMENT_WAKE == 'enabled' && github.event.issue.state == 'open' && !github.event.issue.pull_request && github.event.comment.user.type == 'User' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      operator: ${{ steps.config.outputs.operator }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - id: config
        run: just comment-wake-config

  wake:
    needs: config
    # The author, not the triggering actor (which can change on a rerun).
    if: ${{ needs.config.outputs.operator != '' && github.event.comment.user.login == needs.config.outputs.operator }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      # No checkout, PAT or comment content here. Dispatch the default branch
      # once; poll.yml owns serialization and any subsequent passes.
      - name: Wake poll
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run poll.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
