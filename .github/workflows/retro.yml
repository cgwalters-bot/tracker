# Research with bounded issue proposals, not the comment-only dispatch wrapper.
name: retro
run-name: research retro (openai)

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions: {}
# The agent-board commit that resolves the pool, reviewed here as poll.yml's.
env:
  AGENT_BOARD_REV: 862ca8238603f3da33f8da73c92c0d508465481c
concurrency:
  group: retro
  cancel-in-progress: false

jobs:
  brief:
    # Threat: a new daily miner could spend inference and file duplicate work
    # before its scope is reviewed. One opt-in gates both entries, on main only.
    if: ${{ vars.RETRO == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    # Room for the crates.io fallback for just and the verified download.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      agent: ${{ steps.pool.outputs.agent }}
      model: ${{ steps.pool.outputs.model }}
      budget: ${{ steps.pool.outputs.budget }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install verified agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      # agent-board validates every pool's model and budget; the agent
      # config this job passes is opencode's, so the pool must be too.
      - name: Select the openai pool
        id: pool
        timeout-minutes: 1
        run: |
          out=$("$RUNNER_TEMP/agent-board/bin/agent-board" pools resolve --pools .github/agentic-job/pools.json --pool openai --kind analysis)
          grep -qx 'agent=opencode' <<< "$out" || { echo "::error::the openai pool's agent is not opencode" >&2; exit 1; }
          echo "$out" >> "$GITHUB_OUTPUT"
  policy:
    needs: brief
    uses: cgwalters-forge/agentic-job/.github/workflows/policy.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    permissions:
      contents: read
      actions: read
    with:
      id: research retro (openai)
      repo: cgwalters-forge/tracker
      base: main
      kind: analysis
      task: Read .github/agentic-job/retro.md in the trusted checkout and follow that fixed research brief.
      outputs: create_issue,add_comment,noop,missing_tool,missing_data
      max-outputs: '3'
      allow: .github/agentic-job/retro.toml
      config: .github/agentic-job/hosted.toml
      agent: ${{ needs.brief.outputs.agent }}
      model: ${{ needs.brief.outputs.model }}
      agent-config-repo: cgwalters-forge/agenthome
      agent-config-path: opencode
      budget: ${{ needs.brief.outputs.budget }}
      max-requests: '150'
      timeout: '45'
      inference-url: ${{ vars.INFERENCE_URL }}
      inference-audience: ${{ vars.INFERENCE_AUDIENCE || 'praxis-credential-broker' }}
      comment-target: '*'
      apply-environment: agent-apply
      notify: none
      artifact-prefix: retro-

  agent:
    needs: policy
    if: ${{ needs.policy.outputs.admitted == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    # The only credential the agent receives is this job's read-only token.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      exit: ${{ steps.run.outputs.exit }}
      job: ${{ job.check_run_id }}
      safe-outputs-artifact-id: ${{ steps.run.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ steps.run.outputs.safe-outputs-artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.policy.outputs.ref }}
          persist-credentials: false
      - name: Create the job directory
        run: install -d -m 0711 /var/tmp/agentic-job
      - uses: cgwalters-forge/agentic-job/prepare@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
        with:
          job-dir: /var/tmp/agentic-job
          binary-artifact-id: ${{ needs.policy.outputs.binary-artifact-id }}
          policy-artifact-id: ${{ needs.policy.outputs.policy-artifact-id }}
      - name: Keep the job inputs private
        run: |
          chmod 0600 /var/tmp/agentic-job/*
          chmod 0755 /var/tmp/agentic-job/agentic-job
      - uses: cgwalters-forge/actions/tailscale@main
        with:
          hostname: retro-${{ github.run_id }}-${{ github.run_attempt }}
          oauth-client-id: ${{ vars.AGENTIC_JOB_TAILSCALE_OAUTH_CLIENT_ID }}
          tags: ${{ vars.AGENTIC_JOB_TAILSCALE_TAGS }}
      - name: Check inference reachability
        run: agentic-job secure-host inference /var/tmp/agentic-job/config.toml
      - name: The host configuration
        run: agentic-job config --host --from /var/tmp/agentic-job/config.toml --string sandbox.env.PATH=/var/tmp/agentic-job:/usr/local/bin:/usr/bin:/bin > "$RUNNER_TEMP/agentic-job-host.toml"
      - uses: cgwalters-forge/agentic-job/secure-host@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
        with:
          config: ${{ runner.temp }}/agentic-job-host.toml
      - id: run
        timeout-minutes: 65
        uses: cgwalters-forge/agentic-job/run@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
        with:
          job-dir: /var/tmp/agentic-job
          agent-user: sandbox
          github-token: ${{ github.token }}

  check:
    needs: [policy, agent]
    if: ${{ !cancelled() && needs.policy.result == 'success' && needs.agent.outputs.safe-outputs-artifact-id != '' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/check.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      safe-outputs-artifact-id: ${{ needs.agent.outputs.safe-outputs-artifact-id }}
      safe-outputs-artifact-digest: ${{ needs.agent.outputs.safe-outputs-artifact-digest }}

  apply:
    needs: [policy, agent, check]
    if: ${{ always() && needs.policy.result == 'success' }}
    uses: cgwalters-forge/agentic-job/.github/workflows/apply.yml@3f9f6425119b97bb3620a38fe0adc8e79be7dc8e # v0.6.11
    permissions:
      contents: read
      actions: read
      issues: write
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.CGWALTERS_BOT_PAT }}
    with:
      policy: ${{ toJSON(needs.policy.outputs) }}
      agent: ${{ toJSON(needs.agent) }}
      check: ${{ toJSON(needs.check) }}
