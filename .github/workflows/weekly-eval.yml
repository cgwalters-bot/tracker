# Once a week, start the research run that weighs our own tools against
# gh-aw and whatever else does the same job (cgwalters-forge/tracker#519,
# where each week's comment goes). Nothing runs here but the trigger: the
# run is dispatch.yml's `research` kind, started the way poll.yml starts its
# runs, with the job token and `actions: write`, so no
# secret is read.
name: weekly-eval

on:
  schedule:
    # Tuesdays 07:00 UTC.
    - cron: '0 7 * * 2'
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    # dispatch.yml only runs from the default branch, so the task it is given
    # is this file's as the default branch has it.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # What lets the job token start dispatch.yml here.
    permissions:
      actions: write
    steps:
      - name: Start the research run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          # The standing issue the comment is posted on; it stays open.
          ITEM_REPO: cgwalters-forge/tracker
          ITEM: '519'
          # After profiles/research.md, which already asks for sources read
          # at first hand, the conclusion first and one comment on the item.
          TASK: >-
            This week's re-evaluation of our own tools against the
            alternatives. Compare cgwalters-forge/agentic-job and
            cgwalters-forge/agent-board, each as its main branch is today,
            with github/gh-aw and githubnext/gh-cao (gh-aw's central control
            plane and campaigns) as their main branches are today, and with
            any other
            comparable tool you find (one that runs coding agents from
            GitHub events with bounded, checked effects, or that schedules
            such work from a board). Compare cgwalters-forge/review with
            gh-cao's dashboard the same way. Work from their sources and docs, not
            from memory or from earlier comments on this issue, and name the
            commit of each that you read. Post one short comment on this
            issue, conclusion first: the recommendation (keep going, adopt a
            named piece of theirs, or switch), then what they have that we
            lack, then what we have that they lack. Say what changed since
            the previous weekly comment here, if there is one. Go through
            gh-aw's releases and changelog since that comment and name every
            new feature, not only the ones close to what we already compare:
            orchestration, scheduling or campaign features in particular. For
            each, say in a line whether it matters to us and why.
        run: |
          gh workflow run dispatch.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f kind=research -f repo="$ITEM_REPO" -f item="$ITEM" -f task="$TASK"
