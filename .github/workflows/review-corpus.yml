# Publishes cgwalters' public review feedback on other people's pull
# requests as a dated `review-corpus-YYYYMMDD-HHMMSS` release of this
# repository, a new one each refresh, weekly (#1230, part of #1224);
# docs/review-corpus.md says what it holds and how to pin it. This
# repository's releases are immutable once published, so each is created as
# a draft, given its assets and only then published. misctool's
# `review-corpus collect` resumes from the state file in the newest one, so
# a backfill cut short by the job token's rate limit continues in the next
# run. Off unless the repository variable REVIEW_CORPUS is `enabled`.
name: review-corpus
on:
  schedule:
    # Sundays 05:17 UTC.
    - cron: '17 5 * * 0'
  workflow_dispatch:
permissions: {}
# The collector's state allows one writer: two runs resuming from the same
# release would publish diverging corpora. One run at a time also keeps the
# second-resolution release names unique.
concurrency:
  group: review-corpus
  cancel-in-progress: false
env:
  # A reviewed misctool release, run only after its binary is verified
  # against the attestation misctool's release.yml made for this tag.
  MISCTOOL_VERSION: v0.1.0
  # Each release is this prefix and the UTC time its run began collecting,
  # YYYYMMDD-HHMMSS,
  # so the newest sorts last. The undated `review-corpus` release an earlier
  # version of this workflow left empty does not match and is ignored.
  RELEASE_PREFIX: review-corpus-
  LOGIN: cgwalters
  SINCE: '2020-11-01'
jobs:
  collect:
    if: ${{ vars.REVIEW_CORPUS == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    # The collection (300) and the rest, within GitHub's six-hour job limit.
    timeout-minutes: 350
    # The collector reads public data only. Its job token can write nothing,
    # so neither it nor the comment text it reads can change the release.
    permissions: {}
    outputs:
      collected: ${{ steps.collect.outcome }}
      stamp: ${{ steps.download.outputs.stamp }}
    steps:
      - name: Install verified misctool
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        run: |
          bin=$RUNNER_TEMP/misctool
          gh release download "$MISCTOOL_VERSION" --repo cgwalters-forge/misctool --dir "$bin" --pattern cgwalters-forge-misctool
          gh attestation verify "$bin/cgwalters-forge-misctool" --repo cgwalters-forge/misctool \
            --cert-identity "https://github.com/cgwalters-forge/misctool/.github/workflows/release.yml@refs/tags/$MISCTOOL_VERSION" \
            --source-ref "refs/tags/$MISCTOOL_VERSION" --deny-self-hosted-runners
          chmod +x "$bin/cgwalters-forge-misctool"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Download the current corpus
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        # Resumes from the newest published dated release; drafts, which an
        # interrupted publish leaves, are never read. Only when there is none
        # (the first run) does it start from nothing; a release missing either
        # file stops the run rather than starting over on top of a corpus.
        # The new release is named for this time, before collecting, so a
        # failed publish job re-run late still sorts before later runs.
        run: |
          echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName \
            --jq "[.[].tagName | select(test(\"^${RELEASE_PREFIX}[0-9]{8}-[0-9]{6}\$\"))] | sort | last // empty")
          if [[ -n $latest ]]; then
            echo "Resuming from $latest"
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
              --pattern review-corpus.jsonl.zst --pattern review-corpus-state.json
            for f in review-corpus.jsonl.zst review-corpus-state.json; do
              [[ -f $f ]] || { echo "$latest has no $f" >&2; exit 1; }
            done
            zstd -d --rm review-corpus.jsonl.zst
          fi
      - name: Collect
        id: collect
        # On a rate-limit wait over an hour, exhausted retries or this step's
        # limit, the collector stops with output and state consistent: the
        # rest of the run publishes what it has and the next run resumes.
        continue-on-error: true
        timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cgwalters-forge-misctool review-corpus collect --login "$LOGIN" --since "$SINCE" \
            --out review-corpus.jsonl --state review-corpus-state.json
      - name: Pack
        timeout-minutes: 15
        run: |
          mkdir dist
          cgwalters-forge-misctool review-corpus stats review-corpus.jsonl > dist/stats.json
          zstd -q -19 -T0 review-corpus.jsonl -o dist/review-corpus.jsonl.zst
          cp review-corpus-state.json dist/
          (cd dist && sha256sum review-corpus.jsonl.zst review-corpus-state.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-corpus
          path: dist/
          if-no-files-found: error
          # Long enough to re-run a failed publish job.
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # What lets the job token create and publish this run's release;
    # nothing else in this job runs code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-corpus
          path: dist
      - name: Write the release notes
        env:
          COLLECTED: ${{ needs.collect.outputs.collected }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          state=$([[ $COLLECTED == success ]] && echo complete || echo 'stopped early (rate limit, time limit or error; see the run)')
          { echo "$LOGIN's public review feedback on other people's pull requests since $SINCE, collected by misctool $MISCTOOL_VERSION's \`review-corpus\` ([schema](https://github.com/cgwalters-forge/misctool/blob/$MISCTOOL_VERSION/README.md#jsonl-schema-version-1)). See [docs/review-corpus.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$DEFAULT_BRANCH/docs/review-corpus.md)."
            printf '\nRefreshed %s by %s; collection %s.\n\n~~~\n' "$(date -u +%F)" "$RUN" "$state"
            cat dist/SHA256SUMS
            printf '~~~\n\nStats:\n\n~~~json\n'; cat dist/stats.json; printf '~~~\n'; } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.collect.outputs.stamp }}
        # A draft can still take assets; publishing makes it immutable, so it
        # is published only once all three are uploaded. A run cut short
        # leaves a draft that the next run ignores.
        run: |
          tag=$RELEASE_PREFIX$STAMP
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --target "$GITHUB_SHA" --title "Review corpus $STAMP" --notes-file notes.md \
            dist/review-corpus.jsonl.zst dist/review-corpus-state.json dist/SHA256SUMS
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
      - name: Report an early stop
        if: ${{ needs.collect.outputs.collected != 'success' }}
        run: |
          echo '::error::The collector stopped early on a rate limit, the time limit or an error (see its step in the collect job). What it had is published; the next run resumes, but an error will recur until fixed.'
          exit 1
