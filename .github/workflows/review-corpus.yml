# Publishes cgwalters' public review feedback on other people's pull
# requests as a dated `review-corpus-YYYYMMDD-HHMMSS` release of this
# repository, a new one each refresh, weekly (#1230, part of #1224);
# docs/review-corpus.md says what it holds and how to pin it. This
# repository's releases are immutable once published, so each is created as
# a draft, given its assets and only then published. misctool's
# `review-corpus collect` resumes from the state file in the newest one, so
# a backfill stopped at the job token's quota reserve continues in the next
# run. Off unless the repository variable REVIEW_CORPUS is `enabled`.
name: review-corpus
on:
  schedule:
    # Sundays 05:17 UTC.
    - cron: '17 5 * * 0'
  workflow_dispatch:
permissions: {}
# The collector's state allows one writer: two runs resuming from the same
# release would publish diverging corpora. One run at a time also keeps the
# second-resolution release names unique.
concurrency:
  group: review-corpus
  cancel-in-progress: false
env:
  # A reviewed misctool release, run only after its binary is verified
  # against the attestation misctool's release.yml made for this tag.
  MISCTOOL_VERSION: v0.1.0
  # Each release is this prefix and the UTC time its run began collecting,
  # YYYYMMDD-HHMMSS,
  # so the newest sorts last. The undated `review-corpus` release an earlier
  # version of this workflow left empty does not match and is ignored.
  RELEASE_PREFIX: review-corpus-
  LOGIN: cgwalters
  SINCE: '2020-11-01'
  # The collector shares the job token's core API quota with the pass,
  # dispatch, review and the supervisor; it is stopped once fewer requests
  # than this remain so they keep working. It must be below the token's
  # hourly limit (1000 requests), which a step checks; 0 turns it off.
  RATE_LIMIT_RESERVE: 500
jobs:
  collect:
    if: ${{ vars.REVIEW_CORPUS == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    # The collection (300) and the rest, within GitHub's six-hour job limit.
    timeout-minutes: 350
    # The collector reads public data only. Its job token can write nothing,
    # so neither it nor the comment text it reads can change the release.
    permissions: {}
    outputs:
      collected: ${{ steps.collect.outcome }}
      quota: ${{ steps.collect.outputs.quota }}
      stamp: ${{ steps.download.outputs.stamp }}
    steps:
      - name: Install verified misctool
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 5
        run: |
          bin=$RUNNER_TEMP/misctool
          gh release download "$MISCTOOL_VERSION" --repo cgwalters-forge/misctool --dir "$bin" --pattern cgwalters-forge-misctool
          gh attestation verify "$bin/cgwalters-forge-misctool" --repo cgwalters-forge/misctool \
            --cert-identity "https://github.com/cgwalters-forge/misctool/.github/workflows/release.yml@refs/tags/$MISCTOOL_VERSION" \
            --source-ref "refs/tags/$MISCTOOL_VERSION" --deny-self-hosted-runners
          chmod +x "$bin/cgwalters-forge-misctool"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Download the current corpus
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        # Resumes from the newest published dated release; drafts, which an
        # interrupted publish leaves, are never read. Only when there is none
        # (the first run) does it start from nothing; a release missing either
        # file stops the run rather than starting over on top of a corpus.
        # Corrupt corpus or cursor bytes must not propagate into a new release:
        # verify both against the same release's manifest before decompressing.
        # The new release is named for this time, before collecting, so a
        # failed publish job re-run late still sorts before later runs.
        run: |
          echo "stamp=$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName \
            --jq "[.[].tagName | select(test(\"^${RELEASE_PREFIX}[0-9]{8}-[0-9]{6}\$\"))] | sort | last // empty")
          if [[ -n $latest ]]; then
            echo "Resuming from $latest"
            gh release download "$latest" --repo "$GITHUB_REPOSITORY" \
              --pattern review-corpus.jsonl.zst --pattern review-corpus-state.json --pattern SHA256SUMS
            for f in review-corpus.jsonl.zst review-corpus-state.json; do
              [[ -f $f ]] || { echo "$latest has no $f" >&2; exit 1; }
              checksum=$(sha256sum "$f")
              if ! grep -Fxq -- "$checksum" SHA256SUMS; then
                echo "::error::$latest has a missing or mismatched checksum for $f; restore a verified snapshot before retrying." >&2
                exit 1
              fi
            done
            zstd -d --rm review-corpus.jsonl.zst
          fi
      # A reserve not below the token's hourly limit would stop every run
      # within a minute; fail before collecting or publishing instead.
      - name: Check the quota reserve
        if: ${{ env.RATE_LIMIT_RESERVE != '0' }}
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limit=$(timeout --kill-after=5s 10s gh api rate_limit --jq .resources.core.limit)
          # Malformed API text must not be evaluated as shell arithmetic or
          # accidentally approve a reserve that prevents every backfill run.
          if [[ ! $limit =~ ^[0-9]{1,10}$ ]]; then
            echo '::error::Cannot read a valid core API limit; retry after GitHub quota reads recover.'
            exit 1
          fi
          if ! (( RATE_LIMIT_RESERVE < 10#$limit )); then
            echo "::error::RATE_LIMIT_RESERVE $RATE_LIMIT_RESERVE is not below the job token's core limit of $limit"
            exit 1
          fi
      - name: Collect
        id: collect
        # On a rate-limit wait over an hour, exhausted retries or this step's
        # limit, the collector stops with output and state consistent: the
        # rest of the run publishes what it has and the next run resumes.
        # The step reads the core quota left (the rate_limit endpoint costs
        # none) before starting the collector and once a minute after. Below
        # the reserve it does not start the collector, or stops a still-running
        # one with SIGTERM (a background job ignores SIGINT), SIGKILL after 30
        # seconds, as this step's time limit ends it with signals, and
        # succeeds with output quota=stopped.
        continue-on-error: true
        timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          should_stop() {
            quota=stopped; stop_status=0
            (( RATE_LIMIT_RESERVE == 0 )) && return 1
            # A hung quota read must not leave collection draining the shared token.
            if ! left=$(timeout --kill-after=5s 10s gh api rate_limit --jq .resources.core.remaining) || [[ ! $left =~ ^[0-9]{1,10}$ ]]; then
              quota=unknown; stop_status=1
              return 0
            fi
            (( 10#$left < RATE_LIMIT_RESERVE ))
          }
          stopped() {
            if [[ $quota == unknown ]]; then
              echo '::error::Stopped collecting: cannot read the core API quota; retry after GitHub quota reads recover.'
            else
              echo "::notice::Stopped collecting: $left core API requests left, below the reserve of $RATE_LIMIT_RESERVE"
            fi
            echo "quota=$quota" >> "$GITHUB_OUTPUT"
          }
          if should_stop; then stopped; exit "$stop_status"; fi
          cgwalters-forge-misctool review-corpus collect --login "$LOGIN" --since "$SINCE" \
            --out review-corpus.jsonl --state review-corpus-state.json &
          collector=$!
          while sleep 60 && kill -0 "$collector" 2>/dev/null; do
            should_stop || continue
            kill -TERM "$collector" 2>/dev/null || break
            stopped
            for _ in {1..30}; do kill -0 "$collector" 2>/dev/null || break; sleep 1; done
            kill -KILL "$collector" 2>/dev/null || true
            wait "$collector" || true
            exit "$stop_status"
          done
          wait "$collector"
      - name: Pack
        timeout-minutes: 15
        env:
          COLLECTED: ${{ steps.collect.outcome }}
          QUOTA: ${{ steps.collect.outputs.quota }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir dist
          jq -n --arg outcome "$COLLECTED" --arg quota "$QUOTA" --arg version "$MISCTOOL_VERSION" --arg login "$LOGIN" \
            --arg since "$SINCE" --arg run "$RUN" \
            '{complete: ($outcome == "success" and $quota != "stopped"), stopped_for_quota: ($quota == "stopped"),
              collector_version: $version, login: $login, window: {since: $since, until: null}, run_url: $run}' > dist/status.json
          cgwalters-forge-misctool review-corpus stats review-corpus.jsonl > dist/stats.json
          zstd -q -19 -T0 review-corpus.jsonl -o dist/review-corpus.jsonl.zst
          cp review-corpus-state.json dist/
          (cd dist && sha256sum review-corpus.jsonl.zst review-corpus-state.json status.json > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-corpus
          path: dist/
          if-no-files-found: error
          # Long enough to re-run a failed publish job.
          retention-days: 7

  publish:
    needs: collect
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # What lets the job token create and publish this run's release;
    # nothing else in this job runs code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-corpus
          path: dist
      - name: Write the release notes
        env:
          COLLECTED: ${{ needs.collect.outputs.collected }}
          QUOTA: ${{ needs.collect.outputs.quota }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ $QUOTA == stopped ]]; then state="stopped at the API quota reserve of $RATE_LIMIT_RESERVE requests; the next run resumes"
          elif [[ $COLLECTED == success ]]; then state=complete
          else state='stopped early (rate limit, time limit or error; see the run)'; fi
          { echo "$LOGIN's public review feedback on other people's pull requests since $SINCE, collected by misctool $MISCTOOL_VERSION's \`review-corpus\` ([schema](https://github.com/cgwalters-forge/misctool/blob/$MISCTOOL_VERSION/README.md#jsonl-schema-version-1)). See [docs/review-corpus.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$DEFAULT_BRANCH/docs/review-corpus.md)."
            printf '\nRefreshed %s by %s; collection %s.\n\n~~~\n' "$(date -u +%F)" "$RUN" "$state"
            cat dist/SHA256SUMS
            printf '~~~\n\nStats:\n\n~~~json\n'; cat dist/stats.json; printf '~~~\n'
            printf '\n<!-- review-corpus-run: %s -->\n' "$RUN"; } > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          STAMP: ${{ needs.collect.outputs.stamp }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # A draft can still take assets; publishing makes it immutable, so it
        # is published only once all four are uploaded. A run cut short
        # leaves a draft that the next run ignores. A publish-job retry may
        # repair only its own draft: otherwise a tag collision could replace
        # another run's assets. Never change an already published snapshot.
        run: |
          # Damaged/incomplete artifacts must not become immutable snapshots or
          # replace a recoverable draft's assets. Check exact coverage before any
          # API call; never open paths supplied by the downloaded manifest.
          (cd dist && sha256sum review-corpus.jsonl.zst review-corpus-state.json status.json) > actual-checksums
          LC_ALL=C sort dist/SHA256SUMS > expected-checksums
          LC_ALL=C sort actual-checksums > sorted-checksums
          diff -q expected-checksums sorted-checksums || { echo '::error::Corpus artifact checksum mismatch; restore the verified collection artifact before retrying publication.' >&2; exit 1; }
          tag=$RELEASE_PREFIX$STAMP
          api="repos/$GITHUB_REPOSITORY/releases"
          # Creating a draft does not reject duplicate pending tags. Inspect all
          # pages first, then keep the selected/created ID through publication.
          gh api "$api?per_page=100" --paginate --slurp > releases.json
          jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)]' releases.json > matches.json
          count=$(jq length matches.json)
          if [[ $count == 0 ]]; then
            jq -n --arg tag "$tag" --arg sha "$GITHUB_SHA" --arg title "Review corpus $STAMP" --rawfile notes notes.md '{tag_name:$tag,target_commitish:$sha,name:$title,body:$notes,draft:true,make_latest:"false"}' > create.json
            gh api "$api" --method POST --input create.json > release.json
          elif [[ $count == 1 ]]; then
            jq '.[0]' matches.json > release.json
          else
            echo '::error::Ambiguous corpus tag; inspect duplicate releases before retrying.' >&2
            exit 1
          fi
          jq -e --arg sha "$GITHUB_SHA" --arg tag "$tag" --arg marker "<!-- review-corpus-run: $RUN -->" '.tag_name == $tag and .draft == true and .target_commitish == $sha and (.body | split("\n") | index($marker) != null)' release.json > /dev/null || { echo '::error::Refusing to repair a published or foreign corpus release; inspect the draft before retrying.' >&2; exit 1; }
          id=$(jq -er '.id | select(type == "number" and . > 0 and floor == .)' release.json)
          upload=$(jq -er '.upload_url | split("{")[0]' release.json)
          gh api "$api/$id/assets?per_page=100" --paginate --slurp > assets.json
          for name in review-corpus.jsonl.zst review-corpus-state.json status.json SHA256SUMS; do
            # Clobber only this snapshot's assets, including interrupted uploads.
            jq -r --arg name "$name" '.[][] | select(.name == $name) | .id' assets.json > asset-ids
            while read -r asset; do
              gh api "$api/assets/$asset" --method DELETE
            done < asset-ids
            gh api "$upload?name=$name" --method POST -H 'Content-Type: application/octet-stream' --input "dist/$name" > /dev/null
          done
          gh api "$api/$id" --method PATCH -F draft=false -f make_latest=false > /dev/null
      # A stop at the quota reserve is expected during a backfill and does
      # not fail the run.
      - name: Report an early stop
        if: ${{ needs.collect.outputs.collected != 'success' }}
        run: |
          echo '::error::The collector stopped early on a rate limit, the time limit or an error (see its step in the collect job). What it had is published; the next run resumes, but an error will recur until fixed.'
          exit 1
