# Promotes approved drafts in midstream forks upstream. Which repositories
# qualify comes from repository metadata, never from a switch here.
# A manual run may instead preview the one-time draft-body repair
# (agent-board issue 1002) with the same verified binary and token; the
# preview writes nothing. Apply is deliberately not offered: it waits for
# the footer fix in the pin and a dispatch gate limited to the controller.
# Schedules have no inputs, so they only ever promote.
name: promote
on:
  schedule:
    - cron: '17,32,47,2 * * * *'
  workflow_dispatch:
    inputs:
      repair:
        description: Preview the draft-body repair instead of promoting; writes nothing
        type: choice
        options: ['off', preview]
        default: 'off'

permissions: {}
# Two promoters could publish the same approved head concurrently.
concurrency:
  group: promote
  cancel-in-progress: false

env:
  AGENT_BOARD_REV: 75b14e2ce8fd43d7388aa0cb3ccf2ed26a54ca03

jobs:
  promote:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install verified agent-board
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: Promote approved drafts
        if: ${{ inputs.repair != 'preview' }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
        run: '"$AGENT_BOARD" promote --config .github/pass.json --apply --max-writes 4'
      # The preview's before/after, unchanged and held lines are this run's
      # public, human-readable log; there is no machine-readable report.
      - name: Preview draft-body repair
        if: ${{ inputs.repair == 'preview' }}
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
        run: '"$AGENT_BOARD" promote --config .github/pass.json --repair-bodies'
