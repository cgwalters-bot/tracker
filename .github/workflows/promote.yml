# Threat: enabling a new upstream writer before its publication policy has
# been reviewed. PROMOTE=enabled is the sole opt-in; unset is off.
name: promote
on:
  schedule:
    - cron: '17,32,47,2 * * * *'
  workflow_dispatch:

permissions: {}
# Two promoters could publish the same approved head concurrently.
concurrency:
  group: promote
  cancel-in-progress: false

env:
  AGENT_BOARD_REV: 6a5dabd564cfcc199756a1a643906af6afe55412

jobs:
  promote:
    if: ${{ vars.PROMOTE == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install verified agent-board
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: Promote approved drafts
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
        run: '"$AGENT_BOARD" promote --config .github/pass.json --apply --max-writes 4'
