# The dispatch caller that `gh workflow run dispatch.yml` and the pass
# (poll.yml) start. The run itself
# is our wrapper's, cgwalters-forge/actions' cgwalters-agentic-job.yml: it
# carries the agentic-job pin, the tailnet join, the inference proxy, the
# runner and the model. This file keeps what is this repository's: the
# trigger and its inputs, the run name, the concurrency, the
# environment that gates apply and which secret is the apply token; the
# bounds are in .github/agentic-job (dispatch.toml, comment.toml for
# `triage` and `research`, fix.toml for `fix`, midstream.toml and
# midstream-fix.toml in their place for a midstream fork) and
# the runner configuration in hosted.toml there, the wrapper's default paths.
# The `pool` input picks the agent and model from the closed set in pools.json
# there; empty leaves them to the repository variables AGENT and AGENT_MODEL.
# Optional effort=heavy changes only that pool's model; an inherited pool
# must match AGENT/AGENT_MODEL uniquely. No guessed deployment-model default.
# The `config` input picks the runner configuration from a closed set too:
# `hosted` leaves the wrapper's default, `acp-experiment` is the child-agent
# experiment's acp-experiment.toml there.
# Ours too is the standing brief of each kind, profiles/KIND.md there: the
# `profile` job puts it before the task, so a dispatch carries only what is
# particular to its item. The wrapper adds its own line on top, which says
# what the kind may hand back.
# Non-review calls follow main (#544). Review is a separate immutable call:
# its wrapper owns REVIEW_POOLS, base policy/config and checked submission.
name: dispatch
run-name: ${{ inputs.kind }} ${{ inputs.repo }}#${{ inputs.item }}${{ inputs.kind == 'review' && format(' {0} ({1})', inputs.head, inputs.pool) || (inputs.pool && format(' ({0})', inputs.pool) || '') }}${{ inputs.kind != 'review' && inputs.config == 'acp-experiment' && ' [acp-experiment]' || '' }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: Public task for the agent, after the kind's profile (.github/agentic-job/profiles)
        type: string
        required: true
      repo:
        description: Public target repository, OWNER/NAME, allowed by the bounds
        type: string
        required: true
      item:
        description: Positive issue number in the target repository (a pull request's for review and fix)
        type: string
        required: true
      kind:
        description: Fixed profile (review and fix take a pull request number; fix only where fix.toml or midstream-fix.toml allows it)
        type: choice
        options: [implement, triage, research, review, fix]
        required: true
      head:
        description: "Review only: required exact lowercase 40-hex expected PR head"
        type: string
        default: ''
      pool:
        description: "Non-review: pools.json or empty for AGENT/AGENT_MODEL. Review: required key in trusted REVIEW_POOLS, resolved only by the pinned wrapper"
        type: string
        default: ''
      # Prevent arbitrary model selection and silent downgrade: the only
      # opt-in is heavy, resolved within the same deployment-owned pool.
      effort:
        description: "Optional model variant: empty preserves defaults; heavy requires the effective pool's heavy.model (not for reviews)"
        type: string
        default: ''
      config:
        description: "Runner configuration: hosted, the wrapper's default, or acp-experiment, a Vibe child agent for the run's agent to drive (.github/agentic-job/acp-experiment.toml)"
        type: choice
        options: [hosted, acp-experiment]
        default: hosted
      runner:
        description: "Caller-owned runner profile; external execution is not implemented"
        type: string
        default: hosted

permissions: {}
# The agent-board commit that resolves the pool, a revision reviewed here
# like the pass's in poll.yml, never agent-board's moving branch.
env:
  AGENT_BOARD_REV: 8a483153544ec08059e19f3e22af392da5683c4a
concurrency:
  group: dispatch-${{ inputs.kind }}-${{ inputs.repo }}-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  # Threat: issue/plan text could redirect execution to a credential-bearing
  # runner or arbitrary workflow. Only this caller commit owns the closed map.
  # No external entry, even enabled, can start execution in this slice.
  runner-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: read
    steps:
      - if: inputs.runner != 'hosted'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/agentic-job/runner-profiles.json
            .github/agentic-job/midstream.toml
      - name: Validate runner profile
        env:
          RUNNER_PROFILE: ${{ inputs.runner }}
          KIND: ${{ inputs.kind }}
          REPO: ${{ inputs.repo }}
          POOL: ${{ inputs.pool }}
          EFFORT: ${{ inputs.effort }}
          CONFIG: ${{ inputs.config }}
          DETECT_MODEL: ${{ vars.AGENTIC_JOB_DETECT_MODEL }}
          CALLER_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys, tomllib
          from pathlib import Path

          def require(ok, message):
              if not ok:
                  sys.exit(message)

          name = os.environ['RUNNER_PROFILE']
          if name == 'hosted':
              sys.exit(0)  # Do not even open the map or midstream bounds.
          require(os.environ['CALLER_REF'] == 'refs/heads/' + os.environ['DEFAULT_BRANCH'],
                  'external runner requires the trusted caller default branch')

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, 'duplicate runner map key')
                  result[key] = value
              return result

          def keys(value, required, optional=()):
              require(type(value) is dict and set(required) <= value.keys()
                      and value.keys() <= set(required) | set(optional), 'invalid runner map keys')

          def matches(value, pattern):
              return type(value) is str and re.fullmatch(pattern, value) is not None

          profiles = json.loads(Path('.github/agentic-job/runner-profiles.json').read_text(),
                                object_pairs_hook=unique)
          require(type(profiles) is dict, 'runner map must be an object')
          limits = ('vcpus', 'memory-gib', 'disk-gib', 'max-guests', 'job-minutes',
                    'lifetime-minutes', 'max-attempts', 'artifact-retention-days')
          for key, profile in profiles.items():
              require(key != 'hosted' and matches(key, r'[a-z0-9][a-z0-9_-]{0,31}'),
                      'invalid runner profile name')
              keys(profile, ('enabled', 'repository', 'workflow', 'ref', 'commit',
                             'agentic-job', 'actions', 'inputs', 'kvm', 'limits'), ('libvirt',))
              require(type(profile['enabled']) is bool and type(profile['kvm']) is bool,
                      'runner enabled/kvm must be booleans')
              require('libvirt' not in profile or profile['libvirt'] == 'session',
                      'runner libvirt must be session or absent')
              require(matches(profile['repository'], r'[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+')
                      and profile['repository'].split('/')[1] not in ('.', '..')
                      and not profile['repository'].endswith('.git'), 'invalid runner repository')
              require(matches(profile['workflow'], r'\.github/workflows/[A-Za-z0-9_-]+\.ya?ml'),
                      'invalid runner workflow path')
              ref = profile['ref']
              require(matches(ref, r'[A-Za-z0-9_-][A-Za-z0-9_./-]*') and '..' not in ref
                      and '//' not in ref and not ref.endswith(('/', '.', '.lock')),
                      'invalid runner branch ref')
              for pin in ('commit', 'agentic-job', 'actions'):
                  require(matches(profile[pin], r'[0-9a-f]{40}'), 'runner pins must be immutable lowercase commits')
              inputs = profile['inputs']
              require(type(inputs) is dict and all(matches(k, r'[A-Za-z][A-Za-z0-9_-]*')
                      and type(v) is str for k, v in inputs.items()), 'runner inputs must be fixed strings')
              # These belong to trusted dispatch, not the deployment's fixed choices.
              require(not set(inputs) & {'task', 'kind', 'repo', 'item', 'base', 'head',
                      'base-commit', 'dispatch-id', 'runner'}, 'runner inputs override dispatch identity')
              keys(profile['limits'], limits)
              require(all(type(profile['limits'][k]) is int and profile['limits'][k] > 0
                          for k in limits), 'runner limits must be positive integers')
              require(profile['limits']['job-minutes'] < profile['limits']['lifetime-minutes'] <= 330,
                      'runner lifetime must exceed job time and fit the 330-minute waiting ceiling')
          require(name in profiles, 'unknown runner profile')
          profile = profiles[name]
          require(profile['enabled'], 'runner profile is disabled')
          require(os.environ['KIND'] == 'implement', 'external runner requires implement')
          bounds = tomllib.loads(Path('.github/agentic-job/midstream.toml').read_text())
          require(os.environ['REPO'].lower() in [r.lower() for r in bounds['repos']],
                  'external runner target is outside midstream bounds')
          require(not os.environ['POOL'] and not os.environ['EFFORT'], 'external runner refuses pool/effort')
          require(os.environ['CONFIG'] == 'hosted', 'external runner requires hosted config')
          require(os.environ['DETECT_MODEL'].strip(), 'external runner requires trusted detection configuration')
          sys.exit('external runner execution is unimplemented')
          PY

  # Threat: a manual/producer review dispatch could start duplicate, unpaced
  # inference while legacy events remain authoritative. Only a trusted repo
  # variable can activate this route; dispatch inputs cannot override it.
  review-gate:
    needs: runner-gate
    if: ${{ inputs.kind == 'review' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Validate dormant review route
        env:
          ACTIVATION: ${{ vars.REVIEW_DISPATCH }}
          HEAD: ${{ inputs.head }}
          EFFORT: ${{ inputs.effort }}
          CONFIG: ${{ inputs.config }}
        run: |
          node -e '
          if (process.env.ACTIVATION !== "enabled") throw Error("ordinary reviews are disabled");
          if (!/^[0-9a-f]{40}$/.test(process.env.HEAD) || process.env.HEAD.length !== 40) throw Error("review requires exact expected head");
          if (process.env.EFFORT || process.env.CONFIG !== "hosted") throw Error("review configuration belongs to REVIEW_POOLS");
          '

  review:
    needs: review-gate
    if: ${{ inputs.kind == 'review' }}
    # Immutable wrapper from actions#217 (runner-only, agentic-job 427ce22),
    # not a release tag.
    uses: cgwalters-forge/actions/.github/workflows/cgwalters-agentic-job.yml@ba6c56925e63551fd4373fbeb23456a2f4a316da
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      kind: review
      repo: ${{ inputs.repo }}
      item: ${{ inputs.item }}
      head: ${{ inputs.head }}
      pool: ${{ inputs.pool }}
      task: Review the expected head using base-owned policy.
    # No secrets: publication uses this base repository's job token.

  # The task the agent gets: this kind's profile, then what was dispatched.
  # Read from the commit the run is on, which the wrapper requires to be
  # the default branch's, so a profile changes only by a merge here.
  profile:
    needs: runner-gate
    if: ${{ inputs.kind != 'review' }}
    runs-on: ubuntu-26.04
    # Room for the crates.io fallback for just and the verified download.
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      task: ${{ steps.compose.outputs.task }}
      agent: ${{ steps.pool.outputs.agent }}
      model: ${{ steps.pool.outputs.model }}
      budget: ${{ steps.pool.outputs.budget }}
      skilled: ${{ steps.pool.outputs.skilled }}
      config: ${{ steps.config.outputs.config }}
      allow: ${{ steps.bounds.outputs.allow }}
      fix-allow: ${{ steps.bounds.outputs.fix-allow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/agentic-job/profiles
            .github/agentic-job/pools.json
            .github/agentic-job/midstream.toml
            .github/agentic-job/midstream-fix.toml
            .github/agent-board-install
            Justfile
      # A GitHub release outage must not stop the job: build the same just
      # from crates.io instead, as poll.yml does.
      - id: just
        continue-on-error: true
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      - if: steps.just.outcome == 'failure'
        run: cargo install --locked --version 1.58.0 just && echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install verified agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      # The pool's agent, model and budget, all empty without a pool so that
      # the wrapper falls back to the variables and its default budget, and
      # whether that agent gets agentic-job's skills. A
      # name outside pools.json stops the run here rather than reaching the
      # wrapper. Heavy replaces only the pool's model; it requires an explicit
      # pool or the one pool matching AGENT/AGENT_MODEL, never a guess from
      # the agent alone, and its valid heavy.model; inherited agent/budget
      # fallbacks stay unchanged. Reviews never take heavy: their model
      # contract is separately pinned and base-owned (#1198). An error writes
      # no outputs.
      - name: Resolve the pool
        id: pool
        timeout-minutes: 1
        env:
          POOL: ${{ inputs.pool }}
          EFFORT: ${{ inputs.effort }}
          KIND: ${{ inputs.kind }}
          # The wrapper's fallback without a pool, its default included.
          AGENT: ${{ vars.AGENT || 'opencode' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          "$RUNNER_TEMP/agent-board/bin/agent-board" pools resolve --pools .github/agentic-job/pools.json \
            --pool "$POOL" --effort "$EFFORT" --kind "$KIND" \
            --fallback-agent "$AGENT" --fallback-model "$AGENT_MODEL" >> "$GITHUB_OUTPUT"
      # The runner configuration's path, from the closed set alone: a path
      # a dispatcher typed could name any file of this repository as the
      # run's configuration, the bounds files included. Empty for hosted, so
      # that a normal run's configuration stays the wrapper's default.
      - name: Resolve the runner configuration
        id: config
        env:
          CONFIG: ${{ inputs.config }}
        run: |
          case "$CONFIG" in
            hosted) path= ;;
            acp-experiment) path=.github/agentic-job/acp-experiment.toml ;;
            *) echo "::error::unknown config '${CONFIG}'; expected hosted or acp-experiment"; exit 1 ;;
          esac
          echo "config=${path}" >> "$GITHUB_OUTPUT"
      # The bounds, by kind and target. Comment-only kinds have their own,
      # comment.toml, the only ones that admit bootc-dev besides fix.toml
      # (D17, docs/operator-notes.md). A midstream fork, a target that
      # midstream.toml or midstream-fix.toml lists, gets those, which keep
      # its pull requests drafts (#336); their repos lists are the only list
      # of midstreams here. The wrapper takes `fix-allow` for fix and
      # `allow` for every other kind.
      - name: Resolve the bounds
        id: bounds
        env:
          KIND: ${{ inputs.kind }}
          REPO: ${{ inputs.repo }}
        run: |
          dir=.github/agentic-job
          listed() {
            sed -n '/^repos = /{s///p;q}' "$1" |
              jq -e --arg repo "${REPO,,}" 'map(ascii_downcase) | index($repo)' > /dev/null
          }
          case "$KIND" in
            triage|research) allow=$dir/comment.toml ;;
            *) allow=$dir/dispatch.toml; listed "$dir/midstream.toml" && allow=$dir/midstream.toml ;;
          esac
          fix=$dir/fix.toml
          listed "$dir/midstream-fix.toml" && fix=$dir/midstream-fix.toml
          printf 'allow=%s\nfix-allow=%s\n' "$allow" "$fix" >> "$GITHUB_OUTPUT"
      - name: Put the profile before the task
        id: compose
        env:
          KIND: ${{ inputs.kind }}
          TASK: ${{ inputs.task }}
          SKILLED: ${{ steps.pool.outputs.skilled }}
        run: |
          profile=".github/agentic-job/profiles/${KIND}.md"
          [[ "$KIND" =~ ^[a-z]+$ && -s "$profile" ]] ||
            { echo "::error::no profile for kind '${KIND}' (${profile})"; exit 1; }
          # profiles/implement.md says "Use the implement skill" and leaves
          # the procedure to it. An agent without skills (vibe, from the
          # mistral pool) would get no procedure at all, so it gets
          # KIND-full.md, the procedure spelled out, self-review included,
          # where one exists (#524, #543). Fix has no skill yet and no -full
          # file; its one profile spells the procedure out.
          if [[ "$SKILLED" != true && -s "${profile%.md}-full.md" ]]; then
            profile="${profile%.md}-full.md"
          fi
          # A delimiter neither text can contain.
          delimiter="task-$(openssl rand -hex 16)"
          {
            echo "task<<${delimiter}"
            cat "$profile"
            printf '\n%s\n' "$TASK"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  run:
    needs: profile
    if: ${{ inputs.kind != 'review' }}
    uses: cgwalters-forge/actions/.github/workflows/cgwalters-agentic-job.yml@main
    # The most any job of the wrapper has: its agent job takes the reads and
    # the identity token, its policy and apply calls the comment writes.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      task: ${{ needs.profile.outputs.task }}
      repo: ${{ inputs.repo }}
      item: ${{ inputs.item }}
      kind: ${{ inputs.kind }}
      agent: ${{ needs.profile.outputs.agent }}
      model: ${{ needs.profile.outputs.model }}
      budget: ${{ needs.profile.outputs.budget || '500' }}
      config: ${{ needs.profile.outputs.config }}
      # agentic-job's implement skill and diff-reviewer subagent, so that a
      # run reviews its own change before it hands it back (#543) and
      # profiles/implement.md need not spell the procedure out. The wrapper
      # honours it only for implement with claude or opencode; fix is asked
      # for too, but keeps its profile's full text, its own self-review
      # loop included, until agentic-job has a fix skill (its #542). Off
      # for an agent without skills, which gets the full profile instead
      # (the profile job), with the same loop.
      skills: ${{ needs.profile.outputs.skilled == 'true' && (inputs.kind == 'implement' || inputs.kind == 'fix') }}
      apply-environment: agent-apply
      # From the profile job, which says how it picks them.
      allow: ${{ needs.profile.outputs.allow }}
      fix-allow: ${{ needs.profile.outputs.fix-allow }}
    # The bot's token, an organization secret, named and never inherited.
    # The wrapper hands it to apply, in the environment above, and to the
    # status comment on an item of another repository; to nothing else.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.CGWALTERS_BOT_PAT }}
