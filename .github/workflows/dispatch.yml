# The dispatch caller that `bot-runs dispatch --backend agentic-job --caller
# cgwalters-forge/tracker` and the pull request poll start. The run itself
# is our wrapper's, cgwalters-forge/actions' cgwalters-agentic-job.yml: it
# carries the agentic-job pin, the tailnet join, the inference proxy, the
# runner and the model. This file keeps what is this repository's: the
# trigger and its four inputs, the run name, the concurrency, the
# environment that gates apply and which secret is the apply token; the
# bounds are in .github/agentic-job (dispatch.toml, fix.toml for `fix`) and
# the runner configuration in hosted.toml there, the wrapper's default paths.
# To take a newer agentic-job or wrapper, move the commit in `uses`.
name: dispatch
run-name: ${{ inputs.kind }} ${{ inputs.repo }}#${{ inputs.item }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: Public task for the agent
        type: string
        required: true
      repo:
        description: Public target repository, OWNER/NAME, allowed by the bounds
        type: string
        required: true
      item:
        description: Positive issue number in the target repository (a pull request's for review and fix)
        type: string
        required: true
      kind:
        description: Fixed profile (review and fix take a pull request number; fix only where fix.toml allows it)
        type: choice
        options: [implement, triage, research, review, fix]
        required: true

permissions: {}
concurrency:
  group: dispatch-${{ inputs.kind }}-${{ inputs.repo }}-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  run:
    uses: cgwalters-forge/actions/.github/workflows/cgwalters-agentic-job.yml@baa486b64ff3bb79cb63a4d2069206d837fad958
    # The most any job of the wrapper has: its agent job takes the reads and
    # the identity token, its policy and apply calls the comment writes.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      task: ${{ inputs.task }}
      repo: ${{ inputs.repo }}
      item: ${{ inputs.item }}
      kind: ${{ inputs.kind }}
      apply-environment: agent-apply
    # The bot's token, an organization secret, named and never inherited.
    # The wrapper hands it to apply, in the environment above, and to the
    # status comment on an item of another repository; to nothing else.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.CGWALTERS_BOT_PAT }}
