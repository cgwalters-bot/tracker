# The dispatch caller that `bot-runs dispatch --backend agentic-job --caller
# cgwalters-forge/tracker` and the pull request poll start. The run itself
# is our wrapper's, cgwalters-forge/actions' cgwalters-agentic-job.yml: it
# carries the agentic-job pin, the tailnet join, the inference proxy, the
# runner and the model. This file keeps what is this repository's: the
# trigger and its five inputs, the run name, the concurrency, the
# environment that gates apply and which secret is the apply token; the
# bounds are in .github/agentic-job (dispatch.toml, fix.toml for `fix`) and
# the runner configuration in hosted.toml there, the wrapper's default paths.
# The `pool` input picks the agent and model from the closed set in pools.json
# there; empty leaves them to the repository variables AGENT and AGENT_MODEL.
# Ours too is the standing brief of each kind, profiles/KIND.md there: the
# `profile` job puts it before the task, so a dispatch carries only what is
# particular to its item. The wrapper adds its own line on top, which says
# what the kind may hand back.
# To take a newer agentic-job or wrapper, move the commit in `uses`.
name: dispatch
run-name: ${{ inputs.kind }} ${{ inputs.repo }}#${{ inputs.item }}${{ inputs.pool && format(' ({0})', inputs.pool) || '' }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: Public task for the agent, after the kind's profile (.github/agentic-job/profiles)
        type: string
        required: true
      repo:
        description: Public target repository, OWNER/NAME, allowed by the bounds
        type: string
        required: true
      item:
        description: Positive issue number in the target repository (a pull request's for review and fix)
        type: string
        required: true
      kind:
        description: Fixed profile (review and fix take a pull request number; fix only where fix.toml allows it)
        type: choice
        options: [implement, triage, research, review, fix]
        required: true
      pool:
        description: "Inference pool: claude, openai or mistral (.github/agentic-job/pools.json); empty uses the variables AGENT and AGENT_MODEL"
        type: string
        default: ''

permissions: {}
concurrency:
  group: dispatch-${{ inputs.kind }}-${{ inputs.repo }}-${{ inputs.item }}
  cancel-in-progress: false

jobs:
  # The task the agent gets: this kind's profile, then what was dispatched.
  # Read from the commit the run is on, which the wrapper requires to be
  # the default branch's, so a profile changes only by a merge here.
  profile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      task: ${{ steps.compose.outputs.task }}
      agent: ${{ steps.pool.outputs.agent }}
      model: ${{ steps.pool.outputs.model }}
      budget: ${{ steps.pool.outputs.budget }}
      skilled: ${{ steps.pool.outputs.skilled }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/agentic-job/profiles
            .github/agentic-job/pools.json
      # The pool's agent, model and budget, all empty without a pool so that
      # the wrapper falls back to the variables and its default budget, and
      # whether that agent gets agentic-job's skills. A
      # name outside pools.json stops the run here rather than reaching the
      # wrapper.
      - name: Resolve the pool
        id: pool
        env:
          POOL: ${{ inputs.pool }}
          KIND: ${{ inputs.kind }}
          # The wrapper's fallback without a pool, its default included.
          AGENT: ${{ vars.AGENT || 'opencode' }}
        run: |
          pools=.github/agentic-job/pools.json
          if [[ -n "$POOL" ]] && ! jq -e --arg pool "$POOL" 'has($pool)' "$pools" > /dev/null; then
            echo "::error::unknown pool '${POOL}'; expected one of: $(jq -r 'keys | join(", ")' "$pools")"
            exit 1
          fi
          # The wrapper installs agentic-job's skills for claude and opencode
          # only (`skills` below); vibe gets none, so the next step gives it
          # the full profile instead. fake reads no task.
          agent=${POOL:+$(jq -r --arg pool "$POOL" '.[$pool].agent' "$pools")}
          agent=${agent:-$AGENT}
          skilled=false
          [[ "$agent" =~ ^(claude|opencode|fake)$ ]] && skilled=true
          echo "skilled=${skilled}" >> "$GITHUB_OUTPUT"
          [[ -z "$POOL" ]] && { printf "agent=\nmodel=\nbudget=\n" >> "$GITHUB_OUTPUT"; exit 0; }
          jq -r --arg pool "$POOL" '.[$pool] | "agent=\(.agent)\nmodel=\(.model)\nbudget=\(.budget)"' "$pools" >> "$GITHUB_OUTPUT"
      - name: Put the profile before the task
        id: compose
        env:
          KIND: ${{ inputs.kind }}
          TASK: ${{ inputs.task }}
          SKILLED: ${{ steps.pool.outputs.skilled }}
        run: |
          profile=".github/agentic-job/profiles/${KIND}.md"
          [[ "$KIND" =~ ^[a-z]+$ && -s "$profile" ]] ||
            { echo "::error::no profile for kind '${KIND}' (${profile})"; exit 1; }
          # profiles/implement.md says "Use the implement skill" and leaves
          # the procedure to it. An agent without skills (vibe, from the
          # mistral pool) would get no procedure at all, so it gets
          # KIND-full.md, the profile as it was before the skill, where one
          # exists (#524). Fix has no skill yet and no -full file.
          if [[ "$SKILLED" != true && -s "${profile%.md}-full.md" ]]; then
            profile="${profile%.md}-full.md"
          fi
          # A delimiter neither text can contain.
          delimiter="task-$(openssl rand -hex 16)"
          {
            echo "task<<${delimiter}"
            cat "$profile"
            printf '\n%s\n' "$TASK"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  run:
    needs: profile
    uses: cgwalters-forge/actions/.github/workflows/cgwalters-agentic-job.yml@42ad118d85775363833c731898f0fefd0e0d2f27
    # The most any job of the wrapper has: its agent job takes the reads and
    # the identity token, its policy and apply calls the comment writes.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
      id-token: write
    with:
      task: ${{ needs.profile.outputs.task }}
      repo: ${{ inputs.repo }}
      item: ${{ inputs.item }}
      kind: ${{ inputs.kind }}
      agent: ${{ needs.profile.outputs.agent }}
      model: ${{ needs.profile.outputs.model }}
      budget: ${{ needs.profile.outputs.budget || '500' }}
      # agentic-job's implement skill and diff-reviewer subagent, so that a
      # run reviews its own change before it hands it back (#543) and
      # profiles/implement.md need not spell the procedure out. The wrapper
      # honours it only for implement with claude or opencode; fix is asked
      # for too, but keeps its profile's full text until agentic-job has a
      # fix skill (its #542). Off for an agent without skills, which gets
      # the full profile instead (the profile job).
      skills: ${{ needs.profile.outputs.skilled == 'true' && (inputs.kind == 'implement' || inputs.kind == 'fix') }}
      apply-environment: agent-apply
    # The bot's token, an organization secret, named and never inherited.
    # The wrapper hands it to apply, in the environment above, and to the
    # status comment on an item of another repository; to nothing else.
    secrets:
      SAFE_OUTPUTS_PAT: ${{ secrets.CGWALTERS_BOT_PAT }}
