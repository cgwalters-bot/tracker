name: midstream-sync

on:
  schedule:
    - cron: '19 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: midstream-sync
  cancel-in-progress: false

jobs:
  sync:
    # Threat: an unreviewed branch must not run code with the cross-repo PAT.
    # Unset is off; activation is an operator setting, not a dispatch input.
    if: ${{ vars.MIDSTREAM_SYNC == 'enabled' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: agent-apply
    steps:
      - name: Fast-forward midstream default branches and optionally inventory workflows
        shell: node {0}
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          # Unset is off: workflows on the forks are left as they are.
          MIDSTREAM_CI: ${{ vars.MIDSTREAM_CI }}
        run: |
          const { execFileSync } = require('node:child_process');
          const { appendFileSync } = require('node:fs');
          const org = 'cgwalters-forge';
          const audit = process.env.MIDSTREAM_CI === 'enabled';
          // The inventory has its own budget and cannot starve sync.
          const newBudget = () => ({ requests: 650, deadline: Date.now() + 360000 });
          let budget = newBudget();
          function requestTimeout() {
            // Bound stalled requests and oversized org censuses, without retries.
            const remaining = budget.deadline - Date.now();
            if (--budget.requests < 0 || remaining <= 0) throw new Error('request/deadline budget exhausted');
            return Math.min(20000, remaining);
          }
          function api(path, body) {
            const timeout = requestTimeout();
            const args = ['api', '--hostname', 'github.com', path];
            if (body) args.push('--method', 'PATCH', '--input', '-');
            try {
              const out = execFileSync('gh', args, {
                input: body ? JSON.stringify(body) : undefined, encoding: 'utf8',
                timeout, maxBuffer: 8 * 1024 * 1024,
                stdio: ['pipe', 'pipe', 'pipe'],
              });
              return out ? JSON.parse(out) : null;
            } catch (error) {
              // No raw response bodies in the public summary; gh's HTTP code suffices.
              const status = /HTTP (\d{3})/.exec(String(error.stderr ?? ''))?.[1];
              throw new Error(status ? `GitHub HTTP ${status}` : 'API request failed or timed out');
            }
          }
          function list(path) {
            const all = [];
            for (let page = 1; page <= 10; page++) {
              const rows = api(`${path}?per_page=100&page=${page}`);
              if (!Array.isArray(rows)) throw new Error('invalid census response');
              all.push(...rows);
              if (rows.length < 100) return all;
            }
            throw new Error('org census pagination limit exceeded');
          }
          const repoName = value => typeof value === 'string' && /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(value);
          const sha = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
          const branchPath = branch => {
            if (typeof branch !== 'string' || !branch) throw new Error('missing default branch');
            return branch.split('/').map(encodeURIComponent).join('/');
          };
          function admittedFork(name) {
            if (!repoName(name) || name.split('/')[0] !== org) throw new Error('invalid fork identity');
            const fork = api(`repos/${name}`);
            if (fork.full_name !== name || !fork.fork || !fork.topics?.includes('bot-midstream') ||
                fork.custom_properties?.origin !== 'fork') throw new Error('fork metadata changed or missing');
            if (fork.archived || fork.disabled) throw new Error('fork is archived or disabled');
            return fork;
          }
          // Inventory only: Actions metadata tells us the state, not whether a workflow
          // is safe to run. No files are classified and no workflow is toggled.
          function inventory(name) {
            // The summary is public. Let GitHub enforce public access on the listing
            // itself: visibility or ownership can change after admission.
            if (admittedFork(name).visibility !== 'public') return ['  skipped: fork visibility is not public'];
            const timeout = requestTimeout();
            let listing;
            try {
              // No curl config, PAT, or redirects. Do not print remote errors.
              listing = JSON.parse(execFileSync('curl', ['--disable', '--fail', '--silent', '--show-error',
                `https://api.github.com/repos/${name}/actions/workflows?per_page=100`], {
                encoding: 'utf8', timeout, maxBuffer: 8 * 1024 * 1024, stdio: ['ignore', 'pipe', 'pipe'],
              }));
            } catch {
              throw new Error('public workflow listing failed or timed out');
            }
            const workflows = listing?.workflows;
            if (!Array.isArray(workflows) || workflows.length > 100 || listing.total_count !== workflows.length) {
              throw new Error('workflow list incomplete or over 100');
            }
            return workflows.map(row => {
              if (typeof row?.path !== 'string' || !row.path || typeof row.state !== 'string' ||
                  !row.state || /[^a-z_]/.test(row.state)) {
                throw new Error('invalid workflow metadata');
              }
              return `  ${JSON.stringify(row.path)}: ${row.state}`;
            });
          }
          const results = [], verified = [];
          let failed = false;
          try {
            // Complete discovery before any write. No allowlist or cached membership.
            const properties = list(`orgs/${org}/properties/values`);
            const forks = new Set(properties.filter(row => row.properties?.some(
              p => p.property_name === 'origin' && p.value === 'fork')).map(row => row.repository_full_name));
            const candidates = list(`orgs/${org}/repos`).filter(repo =>
              forks.has(repo.full_name) && repo.topics?.includes('bot-midstream'));
            if (candidates.length > 100) throw new Error('fork limit exceeded (100)');
            for (const candidate of candidates) {
              const name = candidate.full_name;
              try {
                const fork = admittedFork(name);
                if (audit) verified.push(name);
                const parent = fork.parent?.full_name;
                if (!repoName(parent)) throw new Error('missing GitHub parent');
                const upstream = api(`repos/${parent}`);
                const target = api(`repos/${parent}/git/ref/heads/${branchPath(upstream.default_branch)}`).object?.sha;
                if (!sha(target)) throw new Error('invalid upstream commit');
                const path = `repos/${name}/git/refs/heads/${branchPath(fork.default_branch)}`;
                const current = api(path.replace('/git/refs/', '/git/ref/')).object?.sha;
                if (!sha(current)) throw new Error('invalid fork commit');
                if (current !== target) {
                  // The server checks ancestry against the live ref, including races.
                  // Never merge, force, or change a ruleset to make this succeed.
                  api(path, { sha: target, force: false });
                }
                const actual = api(path.replace('/git/refs/', '/git/ref/')).object?.sha;
                if (actual !== target) throw new Error('fork moved during sync; does not match observed upstream');
                results.push(`${name}: ${current === target ? 'already equal' : 'fast-forwarded'} to ${target}`);
              } catch (error) {
                failed = true;
                results.push(`${name}: NOT SYNCED — ${error.message} (divergence, protection or API refusal; inspect this fork)`);
              }
            }
          } catch (error) {
            failed = true;
            results.push(`Census incomplete; no sync started: ${error.message}`);
          }
          const heading = 'Midstream sync (observed upstream default-branch commits)';
          console.log(`${heading}\n${results.join('\n') || 'No midstream forks found.'}`);
          if (audit) budget = newBudget();
          // Start at a different fork each hour so a short budget cannot starve the last ones.
          const start = verified.length && Math.floor(Date.now() / 3600000) % verified.length;
          // Leave room for the sync results below GitHub's 1 MiB step-summary limit.
          let reportBytes = 512 * 1024;
          for (const name of [...verified.slice(start), ...verified.slice(0, start)]) {
            try {
              if (reportBytes <= 0) throw new Error('inventory output limit reached');
              const lines = [`${name} workflows (inventory only):`, ...inventory(name)];
              const bytes = Buffer.byteLength(lines.join('\n')) + 1;
              if (bytes > reportBytes) {
                reportBytes = 0;
                throw new Error('inventory output limit reached');
              }
              reportBytes -= bytes;
              results.push(...lines);
            } catch (error) {
              failed = true;
              results.push(`${name}: WORKFLOWS NOT INVENTORIED — ${error.message}`);
            }
          }
          const text = `${heading}\n${results.join('\n') || 'No midstream forks found.'}\n`;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```text\n' + text + '```\n');
          if (failed) process.exitCode = 1;
