# Once a week, gather public material into an issue on the organization
# site, put it on the board at P0 and start dispatch.yml's implement run.
# Deployment templates and budgets live in .github/weekly-digest.json.
# The bot's token writes the issue and board; the job token starts the run.
name: weekly-blog

on:
  schedule:
    # Sundays 18:00 UTC.
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      partial:
        description: Before the week ends (Sunday 18:00 UTC), file what there is so far; the week's post is then written from that
        type: boolean
        default: false

permissions: {}
concurrency:
  group: weekly-blog
  cancel-in-progress: false

# Reviewed agent-board commit; move it with the other workflows' pins.
env:
  AGENT_BOARD_REV: 750c4a1c0c8e53c1fcc49e86f220c3110931bcd7

jobs:
  post:
    # The schedule waits for WEEKLY_BLOG; a run by hand does not.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.WEEKLY_BLOG == 'enabled')
    runs-on: ubuntu-26.04
    # The build (10) and a few API calls.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.58.0
      # Built each run and never cached, as in poll.yml.
      - name: Install verified agent-board
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 10
        run: just build-agent-board "$AGENT_BOARD_REV"
      - name: File the week's material and start the post's run
        env:
          GH_TOKEN: ${{ secrets.CGWALTERS_BOT_PAT }}
          DISPATCH_TOKEN: ${{ github.token }}
          AGENT_BOARD: ${{ runner.temp }}/agent-board/bin/agent-board
          PARTIAL: ${{ inputs.partial }}
        run: |
          args=()
          if [[ "$PARTIAL" == true ]]; then args+=(--partial); fi
          "$AGENT_BOARD" digest --config .github/weekly-digest.json "${args[@]}" --apply
